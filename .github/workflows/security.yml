name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      notification_test:
        description: "Intentionally fail to verify Actions failure email"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

  notification-test:
    name: notification-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail intentionally
        run: |
          echo "::error::Intentional Security workflow notification test"
          exit 1
