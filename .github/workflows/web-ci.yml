name: Build & Publish Images

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify web directory
        run: |
          ls -la
          ls -la web
          test -f web/Dockerfile && echo "Found web/Dockerfile" || (echo "Missing web/Dockerfile" && exit 1)

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check generated article data is in sync
        working-directory: web
        run: |
          npm run build:articles
          git diff --exit-code -- src/data/generated/articles.ts

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Smoke test
        working-directory: web
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build web image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./web
          load: true
          push: false
          tags: web:ci
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: web:ci
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Save validated image (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/web-image.tar" web:ci

      - name: Upload validated image (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-image-${{ github.sha }}
          path: ${{ runner.temp }}/web-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-web:
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated image from this run
        uses: actions/download-artifact@v8
        with:
          name: web-image-${{ github.sha }}
          path: ${{ runner.temp }}/validated-image

      - name: Load validated image
        run: docker load --input "$RUNNER_TEMP/validated-image/web-image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the validated image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/web
        run: |
          set -euo pipefail
          for tag in "$GITHUB_SHA" main latest; do
            docker tag web:ci "$IMAGE_REPOSITORY:$tag"
            docker push "$IMAGE_REPOSITORY:$tag"
          done
