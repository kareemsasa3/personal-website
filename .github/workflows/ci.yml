name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Deployment tests
        run: |
          shellcheck infrastructure/prod/deploy-release.sh infrastructure/prod/restore-web-release.sh infrastructure/tests/*.sh
          node infrastructure/tests/deploy-workflow.test.mjs
          bash infrastructure/tests/deploy-release.test.sh
          bash infrastructure/tests/restore-web-release.test.sh
