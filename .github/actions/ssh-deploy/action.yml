name: SSH Deploy
description: Deploy to the production server over SSH with cleanup, network setup, and Docker Compose
inputs:
  host:
    description: Production host
    required: true
  user:
    description: SSH username
    required: true
  port:
    description: SSH port
    required: true
  ssh_key:
    description: SSH private key (ed25519)
    required: true
  known_hosts:
    description: >-
      The server's host key in known_hosts format, captured and verified out of band.
      It is the only trusted host key. For a port other than 22 the host field must
      be [host]:port.
    required: true
  ghcr_username:
    description: GHCR username
    required: true
  ghcr_token:
    description: GHCR token
    required: true
  grafana_admin_user:
    description: Grafana admin username
    required: true
  grafana_admin_password:
    description: Grafana admin password
    required: true
  repository:
    description: owner/repo for images
    required: true
  sha:
    description: Git SHA to deploy; the image tag ghcr.io/<repository>/web:<sha>
    required: true
  expected_digest:
    description: Optional sha256 digest the image must resolve to (sha256:<64 hex>)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      env:
        HOST_RAW: ${{ inputs.host }}
        PORT_RAW: ${{ inputs.port }}
        KNOWN_HOSTS_RAW: ${{ inputs.known_hosts }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Support both raw OpenSSH key and base64-encoded key in secret
        KEY_RAW="${{ inputs.ssh_key }}"
        # Detect plaintext OpenSSH key; use -- to prevent grep from treating dashes as options
        if printf "%s" "$KEY_RAW" | grep -q -- "BEGIN OPENSSH PRIVATE KEY"; then
          # Looks like a PEM/OpenSSH key; normalize newlines
          printf "%s" "$KEY_RAW" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
        else
          # Try base64 decode first; fallback to literal write if decode fails
          printf "%s" "$KEY_RAW" | tr -d '\r' | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || true
          if ! grep -q -- "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_ed25519 2>/dev/null; then
            printf "%s" "$KEY_RAW" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          fi
        fi
        chmod 600 ~/.ssh/id_ed25519
        # Quick validation/warning if the key is passphrase-protected or invalid
        if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
          echo "WARNING: SSH key appears invalid or passphrase-protected. Ensure an unencrypted OpenSSH ed25519 private key is provided in secrets." >&2
          echo "Key header (first line): $(head -n1 ~/.ssh/id_ed25519 2>/dev/null || echo 'N/A')" >&2
        fi

        # Host authentication. The known_hosts input, verified out of band, is the
        # only trusted host key. Nothing is learned from the network (no
        # key scan, no trust on first use), and every SSH call below uses
        # StrictHostKeyChecking=yes against this file alone (other known_hosts
        # files, KnownHostsCommand and DNS lookups are switched off). Any problem with it
        # stops the deploy before a connection is made.
        HOST=$(printf "%s" "$HOST_RAW" | tr -d ' \t\r\n')
        PORT=$(printf "%s" "$PORT_RAW" | tr -d ' \t\r\n')
        if [ -z "$PORT" ]; then PORT=22; fi
        KNOWN_HOSTS_FILE=~/.ssh/deploy_known_hosts
        printf "%s\n" "$KNOWN_HOSTS_RAW" | tr -d '\r' > "$KNOWN_HOSTS_FILE"
        chmod 600 "$KNOWN_HOSTS_FILE"

        # Each entry must be "[@marker] hosts keytype key [comment]" with a key
        # that parses. ssh-keygen alone is not enough: -l accepts a file with
        # invalid lines beside a valid one, and -F matches on the host field only.
        KEY_CHECK=$(mktemp ~/.ssh/key_check.XXXXXX)
        entries=0
        lineno=0
        while IFS= read -r line || [ -n "$line" ]; do
          lineno=$((lineno + 1))
          read -r -a fields <<< "$line"
          if [ "${#fields[@]}" -eq 0 ] || [[ "${fields[0]}" == \#* ]]; then continue; fi
          if [[ "${fields[0]}" == @* ]]; then fields=("${fields[@]:1}"); fi
          if [ "${#fields[@]}" -lt 3 ]; then
            echo "ERROR: known_hosts line $lineno is not a 'host keytype key' entry." >&2
            rm -f "$KEY_CHECK"
            exit 1
          fi
          printf "%s %s\n" "${fields[1]}" "${fields[2]}" > "$KEY_CHECK"
          if ! ssh-keygen -l -f "$KEY_CHECK" >/dev/null 2>&1; then
            echo "ERROR: known_hosts line $lineno does not hold a valid public key." >&2
            rm -f "$KEY_CHECK"
            exit 1
          fi
          entries=$((entries + 1))
        done < "$KNOWN_HOSTS_FILE"
        rm -f "$KEY_CHECK"
        if [ "$entries" -eq 0 ]; then
          echo "ERROR: known_hosts is empty. Set the PROD_SSH_KNOWN_HOSTS secret to the server's verified host key line." >&2
          exit 1
        fi

        # ssh looks up "host" on port 22 and "[host]:port" on any other port.
        if [ "$PORT" = 22 ]; then LOOKUP="$HOST"; else LOOKUP="[$HOST]:$PORT"; fi
        if ! ssh-keygen -F "$LOOKUP" -f "$KNOWN_HOSTS_FILE" >/dev/null; then
          echo "ERROR: known_hosts has no entry for the deploy host on port $PORT. For a port other than 22 the host field must be [host]:port." >&2
          exit 1
        fi
        echo "Trusted host key fingerprint(s):"
        ssh-keygen -l -F "$LOOKUP" -f "$KNOWN_HOSTS_FILE" | grep -v '^#' | awk '{print "  " $2, $3}'

    - name: Sync deployment files to server
      shell: bash
      run: |
        HOST_RAW='${{ inputs.host }}'
        USER_RAW='${{ inputs.user }}'
        PORT_RAW='${{ inputs.port }}'
        HOST=$(printf "%s" "$HOST_RAW" | tr -d ' \t\r\n')
        USER=$(printf "%s" "$USER_RAW" | tr -d ' \t\r\n')
        PORT=$(printf "%s" "$PORT_RAW" | tr -d ' \t\r\n')
        if [ -z "$PORT" ]; then PORT=22; fi
        SSH_OPTS="-4 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/deploy_known_hosts -o GlobalKnownHostsFile=/dev/null -o KnownHostsCommand=none -o VerifyHostKeyDNS=no -o UpdateHostKeys=no -o CheckHostIP=no -o ConnectTimeout=60 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o IPQoS=none"
        echo "Syncing infrastructure/ to server..."
        tar -czf - infrastructure | \
          ssh $SSH_OPTS -p "$PORT" "$USER@$HOST" \
          "mkdir -p ~/personal-website && tar -xzf - -C ~/personal-website"

    - name: Deploy over SSH
      shell: bash
      env:
        HOST_RAW: ${{ inputs.host }}
        USER_RAW: ${{ inputs.user }}
        PORT_RAW: ${{ inputs.port }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        GHCR_USERNAME: ${{ inputs.ghcr_username }}
        GRAFANA_ADMIN_USER: ${{ inputs.grafana_admin_user }}
        GRAFANA_ADMIN_PASSWORD: ${{ inputs.grafana_admin_password }}
        REPO: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        EXPECTED_DIGEST: ${{ inputs.expected_digest }}
      run: |
        HOST=$(printf "%s" "$HOST_RAW" | tr -d ' \t\r\n')
        USER=$(printf "%s" "$USER_RAW" | tr -d ' \t\r\n')
        PORT=$(printf "%s" "$PORT_RAW" | tr -d ' \t\r\n')
        if [ -z "$PORT" ]; then PORT=22; fi

        # Validate the release identity here too, before anything reaches the server.
        if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "ERROR: sha must be a full 40-character commit SHA" >&2
          exit 1
        fi
        if [ -n "$EXPECTED_DIGEST" ] && ! [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "ERROR: expected_digest must look like sha256:<64 hex characters>" >&2
          exit 1
        fi
        REPO=$(printf "%s" "$REPO" | tr '[:upper:]' '[:lower:]')

        echo "Resolving host: $HOST"
        (getent hosts "$HOST" || nslookup -timeout=5 "$HOST" || dig +short "$HOST") 2>/dev/null || true

        echo "Checking TCP connectivity to $HOST:$PORT"
        if command -v nc >/dev/null 2>&1; then
          nc -zv -w 10 "$HOST" "$PORT" || true
        else
          (echo > "/dev/tcp/$HOST/$PORT") >/dev/null 2>&1 || true
        fi

        SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/deploy_known_hosts -o GlobalKnownHostsFile=/dev/null -o KnownHostsCommand=none -o VerifyHostKeyDNS=no -o UpdateHostKeys=no -o CheckHostIP=no -o ConnectTimeout=60 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o IPQoS=none"

        # The remote command line is parsed by the remote shell, so quote each value.
        REMOTE_ENV="$(printf '%q=%q ' \
          GHCR_TOKEN "$GHCR_TOKEN" \
          GHCR_USERNAME "$GHCR_USERNAME" \
          GRAFANA_ADMIN_USER "$GRAFANA_ADMIN_USER" \
          GRAFANA_ADMIN_PASSWORD "$GRAFANA_ADMIN_PASSWORD" \
          REPO "$REPO" \
          SHA "$SHA" \
          EXPECTED_DIGEST "$EXPECTED_DIGEST")"

        # Retry only when SSH itself fails (exit 255). A deploy script failure is a
        # result, not a transport error, and running the deploy again could undo
        # the script's own recovery.
        status=255
        for attempt in 1 2 3; do
          echo "SSH attempt $attempt..."
          status=0
          ssh -T $SSH_OPTS -p "$PORT" "$USER@$HOST" "$REMOTE_ENV bash -s" \
            < infrastructure/prod/deploy-release.sh || status=$?
          if [ "$status" -ne 255 ]; then break; fi
          echo "SSH connection failed. Retrying in 15s..."
          sleep 15
        done

        if [ "$status" -eq 255 ]; then
          echo "SSH connection diagnostics (-vvv, no deploy):" >&2
          if command -v nc >/dev/null 2>&1; then
            nc -v -w 5 "$HOST" "$PORT" </dev/null || true
          fi
          ssh -vvv -T $SSH_OPTS -p "$PORT" "$USER@$HOST" true || true
        fi
        exit "$status"
