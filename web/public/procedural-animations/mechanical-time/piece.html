<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mechanical Time</title>
<style>
:root{
  --bg:#04070b; --frame:#070b12; --panel:rgba(10,15,23,.9); --panel-line:rgba(226,218,198,.16);
  --ink:#e6dfcd; --ink-dim:#8e949c; --accent:#c9a35a; --focus:#e6dfcd;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#04070b;--frame:#070b12;--panel:rgba(10,15,23,.9);--panel-line:rgba(226,218,198,.16);--ink:#e6dfcd;--ink-dim:#8e949c;--accent:#c9a35a}
}
:root[data-theme="dark"]{--bg:#04070b;--frame:#070b12;--panel:rgba(10,15,23,.9);--panel-line:rgba(226,218,198,.16);--ink:#e6dfcd;--ink-dim:#8e949c;--accent:#c9a35a}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.4 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#cv{display:block;background:var(--frame)}
#hot{position:absolute;right:0;bottom:0;width:72px;height:72px;z-index:3}
#ui{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(780px,calc(100% - 20px));
  background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px 9px;z-index:4;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ui[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
button{font:inherit;font-size:12px;letter-spacing:.05em;color:var(--ink);background:transparent;border:1px solid var(--panel-line);
  border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--ink-dim)}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:1px solid var(--focus);outline-offset:2px}
#tc{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-dim);white-space:nowrap}
#scrub{width:100%;margin:9px 0 6px;accent-color:var(--accent)}
.layers label{font-size:11.5px;color:var(--ink-dim);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.hint{margin-top:5px;font-size:10.5px;color:var(--ink-dim)}
#rm{position:absolute;right:14px;bottom:14px;z-index:3}
#rm[hidden]{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="Mechanical Time: a procedural animation of a mechanical watch movement"></canvas>
  <div id="hot" title="Show controls"></div>
  <button id="rm" type="button" hidden>Play animation</button>
  <div id="ui" hidden role="region" aria-label="Playback controls">
    <div class="row">
      <button id="bPlay" type="button">Pause</button>
      <button id="bRestart" type="button">Restart</button>
      <button id="bNorm" type="button" aria-pressed="true">1×</button>
      <button id="bSlow" type="button" aria-pressed="false">0.25×</button>
      <button id="bEsc" type="button">Escapement</button>
      <span id="tc">0.00</span>
    </div>
    <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline">
    <div class="row layers">
      <label><input type="checkbox" data-layer="train" checked> Train</label>
      <label><input type="checkbox" data-layer="bridges" checked> Bridges</label>
      <label><input type="checkbox" data-layer="case" checked> Case</label>
      <label><input type="checkbox" data-layer="esc" checked> Escapement</label>
      <label><input type="checkbox" data-layer="hands" checked> Hands</label>
      <label><input type="checkbox" data-layer="draft" checked> Drafting</label>
      <label><input type="checkbox" data-layer="notes" checked> Notes</label>
      <label><input type="checkbox" data-layer="blur" checked> Motion blur</label>
    </div>
    <div class="hint">C controls · Space play/pause · R restart · E escapement · S slow motion · ← → step 1 s</div>
  </div>
</div>
<script>
(() => {
'use strict';

/* ═══════════════════════ 0 · MATH ═══════════════════════ */
const PI = Math.PI, TAU = 2 * PI, DEG = PI / 180;
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const sat = x => x < 0 ? 0 : (x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = sat(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = sat(t); return t * t * t * (t * (6 * t - 15) + 10); };
const inOut = t => { t = sat(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const outQuad = t => { t = sat(t); return 1 - (1 - t) * (1 - t); };
const outCubic = t => { t = sat(t); return 1 - Math.pow(1 - t, 3); };
const frac = x => x - Math.floor(x);
const wrapPi = a => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };
const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const vlen = a => Math.hypot(a.x, a.y);
const vnorm = a => { const l = Math.hypot(a.x, a.y) || 1; return V(a.x / l, a.y / l); };
const vrot = (a, t) => { const c = Math.cos(t), s = Math.sin(t); return V(a.x * c - a.y * s, a.x * s + a.y * c); };
const polar = (r, a) => V(r * Math.cos(a), r * Math.sin(a));
const vang = a => Math.atan2(a.y, a.x);
const vlerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);

/* ═══════════════════════ 1 · MOVEMENT SPECIFICATION ═══════════════════════
   Units: movement radius = 1. Screen y points down; positive angles turn clockwise on screen.
   The movement is always seen from the dial side, so the centre (minute) and fourth (seconds)
   arbors turn clockwise and every mesh reverses direction.
   Ratios are those of a conventional 18 000 A/h small-seconds calibre:
     centre → fourth = (80/10)·(75/10) = 60   (1 rev/h → 1 rev/min)
     fourth → escape = 80/8 = 10, 15-tooth escape wheel = 30 beats per escape revolution
   ⇒ 300 beats per seconds-hand revolution: each beat advances the seconds hand exactly 1.2°.
   Stylization (deliberate, labelled on screen): playback beat rate is scaled, never the linkage. */
const SPEC = {
  realBeatsPerSecond: 5,
  train: {
    barrel: { N: 80, R: 0.34 },
    center: { N: 80, R: 0.30, pinion: 10 },
    third:  { N: 75, R: 0.24, pinion: 10 },
    fourth: { N: 80, R: 0.22, pinion: 10 },
    escape: { pinion: 8, teeth: 15, R: 0.12, Rroot: 0.084 },
  },
  // Swiss lever: fork swing ±F, balance lift ±liftHalf (= 5·F via roller/fork lever ratio), amplitude
  esc: { F: 5 * DEG, liftHalf: 25 * DEG, amp: 220 * DEG, rr: 0.045, Lf: 0.225 },
};
const TR = SPEC.train, ES = SPEC.esc;

/* ═══════════════════════ 2 · LAYOUT (derived from tooth counts) ═══════════════════════ */
const moduleOf = w => 2 * w.R / w.N;
const PIN = { // pinion pitch radius = driving wheel's module × leaves / 2
  center: moduleOf(TR.barrel) * TR.center.pinion / 2,
  third:  moduleOf(TR.center) * TR.third.pinion / 2,
  fourth: moduleOf(TR.third) * TR.fourth.pinion / 2,
  escape: moduleOf(TR.fourth) * TR.escape.pinion / 2,
};
const POS = {};
POS.center = V(0, 0);                 // minute arbor at dial centre
POS.fourth = V(0, 0.53);              // small seconds at 6 o'clock
{ const a = TR.center.R + PIN.third, b = TR.third.R + PIN.fourth, c = POS.fourth.y;
  const y = (a * a - b * b + c * c) / (2 * c); POS.third = V(Math.sqrt(a * a - y * y), y); }
POS.barrel = polar(TR.barrel.R + PIN.center, -105 * DEG);
POS.escape = add(POS.fourth, polar(TR.fourth.R + PIN.escape, 200 * DEG));
const FORK_DIR = polar(1, 205 * DEG);
const ESC_D = TR.escape.R / Math.cos(30 * DEG);       // tangential locking: pallets span 60°
POS.fork = add(POS.escape, mul(FORK_DIR, ESC_D));
POS.balance = add(POS.fork, mul(FORK_DIR, ES.Lf + ES.rr));
// Escapement local frame: escape centre at origin, fork pivot straight "up" (−y), mirrored so the
// locally clockwise-derived escapement turns counter-clockwise on the dial-side view.
const RHO = vang(FORK_DIR) + PI / 2;
const LP = V(0, -ESC_D), LB = V(0, -ESC_D - ES.Lf - ES.rr);

/* ═══════════════════════ 3 · MECHANICAL MODEL ═══════════════════════
   One scalar drives everything: B = beats elapsed. Balance θ = A·sin(πB) (local frame);
   beat k is centred on B = k. Fork follows the roller jewel inside the lift window;
   escape wheel advances half a pitch (12°) per beat, through unlock → impulse → drop → lock.
   Every arbor angle is then derived from the escape arbor through exact mesh relations. */
const MESHES = [
  { drv: 'barrel', drn: 'center', N: TR.barrel.N, n: TR.center.pinion },
  { drv: 'center', drn: 'third',  N: TR.center.N, n: TR.third.pinion },
  { drv: 'third',  drn: 'fourth', N: TR.third.N,  n: TR.fourth.pinion },
  { drv: 'fourth', drn: 'escape', N: TR.fourth.N, n: TR.escape.pinion },
];
for (const m of MESHES) m.phi = vang(sub(POS[m.drn], POS[m.drv]));
const HALF_PITCH = TAU / TR.escape.teeth / 2;   // 12°
const A0 = 12 * DEG;                              // puts a tooth exactly at each locking point
const IMP = { unlock: -0.70, impEnd: 0.80, dropEnd: 0.84, recoil: 0.012, impFrac: 0.86, dropFrac: 0.985 };
function escProgress(s) {               // s ∈ [-1,1] through the lift window → fraction of 12°
  if (s <= -1) return 0;
  if (s < IMP.unlock) return -IMP.recoil * smooth((s + 1) / (IMP.unlock + 1));                 // unlocking (draw recoil)
  if (s < IMP.impEnd) return lerp(-IMP.recoil, IMP.impFrac, (s - IMP.unlock) / (IMP.impEnd - IMP.unlock)); // impulse
  if (s < IMP.dropEnd) return lerp(IMP.impFrac, IMP.dropFrac, outQuad((s - IMP.impEnd) / (IMP.dropEnd - IMP.impEnd))); // drop
  if (s < 1) return lerp(IMP.dropFrac, 1, (s - IMP.dropEnd) / (1 - IMP.dropEnd));                // lock + draw
  return 1;
}
function mechAt(B) {
  const k = Math.round(B), u = B - k;
  const th = ES.amp * Math.sin(PI * B);                                    // balance (local)
  const s = clamp(ES.amp * Math.sin(PI * u) / ES.liftHalf, -1, 1);         // progress through lift window
  const psi = -ES.F * clamp(th / ES.liftHalf, -1, 1);                       // fork (local)
  let P = escProgress(s);
  if (s > IMP.unlock && s < IMP.impEnd) P = impulseContact(k, psi, P);     // tooth rides the pallet's impulse face
  const prog = k + P;
  const aL = A0 + prog * HALF_PITCH;                                       // escape wheel (local)
  const A = { escape: PI + RHO - aL };                                      // escape arbor (dial view)
  for (let i = MESHES.length - 1; i >= 0; i--) {
    const m = MESHES[i];
    A[m.drv] = m.phi + (m.n / m.N) * ((m.phi + PI - PI / m.n) - A[m.drn]);
  }
  return { B, k, s, th, psi, prog, aL, A };
}
// During impulse the wheel's position is not interpolated: it is solved from contact. The active tooth's toe
// lies where the tip circle meets the pallet's impulse face at the current fork angle.
function impulseContact(k, psi, guess) {
  const odd = Math.abs(k) % 2 === 1, S = odd ? STONES.entry : STONES.exit, lock = (odd ? -120 : -60) * DEG;
  const c = add(LP, vrot(S.C, psi)), d = sub(add(LP, vrot(S.X, psi)), c), R = TR.escape.R;
  const qa = d.x * d.x + d.y * d.y, qb = 2 * (c.x * d.x + c.y * d.y), qc = c.x * c.x + c.y * c.y - R * R, disc = qb * qb - 4 * qa * qc;
  if (disc < 0) return guess;
  const sq = Math.sqrt(disc), expd = lock + guess * HALF_PITCH; let best = guess, bd = Infinity;
  for (const t of [(-qb - sq) / (2 * qa), (-qb + sq) / (2 * qa)]) {
    const q = add(c, mul(d, t)), an = expd + wrapPi(Math.atan2(q.y, q.x) - expd), dd = Math.abs(an - expd);
    if (dd < bd) { bd = dd; best = (an - lock) / HALF_PITCH; }
  }
  return best;
}

/* ═══════════════════════ 4 · TIMELINE (single source of truth) ═══════════════════════ */
const SCENES = [
  { id: 'tick',       dur: 3.0, title: 'The tick' },
  { id: 'emerge',     dur: 3.9, title: 'Components emerge' },
  { id: 'assemble',   dur: 3.5, title: 'Assembly' },
  { id: 'energy',     dur: 3.6, title: 'Energy flow' },
  { id: 'escapement', dur: 4.4, title: 'Escapement' },
  { id: 'stable',     dur: 1.8, title: 'Time stabilizes' },
  { id: 'finish',     dur: 4.0, title: 'Transformation' },
];
let _acc = 0; for (const s of SCENES) { s.t0 = _acc; _acc += s.dur; s.t1 = _acc; }
const T_END = _acc;
const SC = {}; for (const s of SCENES) SC[s.id] = s;
const at = (id, o) => SC[id].t0 + o;
const sceneAt = t => { for (const s of SCENES) if (t < s.t1) return s; return null; };

const HOME = V(-0.06, 0.04), EXPL = V(-0.02, 0.10), ESCF = vlerp(POS.escape, POS.balance, 0.40), FIN = V(0.72, 0.0);
const LZ = Math.log, YAW_X = -PI / 2;   // exploded view: movement turned a quarter so the train runs across the frame
// keys: [time, value, ease-into-this-key: 's' smoother (default) | 'c' cubic in-out | 'l' linear]
const TRACKS = {
  cx: [[0, POS.fourth.x], [at('tick', 2.8), POS.fourth.x], [at('emerge', 2.0), EXPL.x, 'c'], [at('assemble', 0.2), EXPL.x], [at('assemble', 1.5), HOME.x, 'c'],
       [at('escapement', 0.3), HOME.x], [at('escapement', 1.6), ESCF.x, 'c'], [at('escapement', 3.8), ESCF.x], [at('stable', 0.9), HOME.x, 'c'], [at('finish', 0.15), HOME.x], [at('finish', 1.8), FIN.x, 'c']],
  cy: [[0, POS.fourth.y], [at('tick', 2.8), POS.fourth.y], [at('emerge', 2.0), EXPL.y, 'c'], [at('assemble', 0.2), EXPL.y], [at('assemble', 1.5), HOME.y, 'c'],
       [at('escapement', 0.3), HOME.y], [at('escapement', 1.6), ESCF.y, 'c'], [at('escapement', 3.8), ESCF.y], [at('stable', 0.9), HOME.y, 'c'], [at('finish', 0.15), HOME.y], [at('finish', 1.8), FIN.y, 'c']],
  lz: [[0, LZ(5.2)], [at('tick', 2.8), LZ(5.2)], [at('emerge', 2.0), LZ(0.82), 'c'], [at('assemble', 0.2), LZ(0.82)], [at('assemble', 1.5), LZ(0.84), 'c'], [at('assemble', 3.4), LZ(0.88)],
       [at('escapement', 0.3), LZ(0.88)], [at('escapement', 1.6), LZ(2.7), 'c'], [at('escapement', 3.8), LZ(2.7)], [at('stable', 0.9), LZ(0.88), 'c'], [at('finish', 0.15), LZ(0.88)], [at('finish', 1.8), LZ(0.60), 'c']],
  yaw:  [[0, 0], [at('tick', 2.8), 0], [at('emerge', 2.0), YAW_X, 'c'], [at('assemble', 0.2), YAW_X], [at('assemble', 1.5), 0, 'c']],
  tilt: [[0, 0], [at('tick', 2.8), 0], [at('emerge', 2.0), 0.84, 'c'], [at('assemble', 0.2), 0.84], [at('assemble', 1.5), 0.6, 'c'], [at('assemble', 2.2), 0.6], [at('assemble', 3.4), 0, 'c']],
  cz:   [[0, 0], [at('tick', 2.8), 0], [at('emerge', 2.0), 0.30, 'c'], [at('assemble', 0.2), 0.30], [at('assemble', 1.5), 0.22, 'c'], [at('assemble', 3.4), 0, 'c']],
  // beat rate (beats per second of playback). Held at 0 while the movement is disassembled.
  rate: [[0, 0.85], [at('emerge', 0), 0.85], [at('emerge', 1.2), 0], [at('assemble', 3.3), 0], [at('energy', 0.5), 1.6], [at('energy', 2.6), 1.6],
         [at('energy', 3.1), 30, 'c'], [at('energy', 3.5), 30, 'l'], [at('escapement', 0.5), 2.0, 'c'], [at('escapement', 1.1), 0.9], [at('escapement', 3.9), 0.9, 'l'],
         [at('stable', 0.5), 2.0], [at('finish', 1.4), 2.0], [at('finish', 4.0), 1.0]],
  ramp: [[0, 0], [at('escapement', 0.7), 0], [at('escapement', 1.4), 0.72], [at('escapement', 3.8), 0.72, 'l'], [at('stable', 0.3), 0]],
  bg: [[0, 0.10], [at('tick', 2.4), 0.22], [at('emerge', 1.6), 1]],
  aHand: [[0, 0], [0.2, 0], [0.85, 1], [at('emerge', 1.0), 1], [at('emerge', 2.2), 0.8], [at('assemble', 2.6), 0.8], [at('assemble', 3.3), 1]],
  aDraft: [[0, 1], [at('emerge', 0.3), 1], [at('emerge', 1.6), 0]],
  dim: [[0, 1], [at('escapement', 0.3), 1], [at('escapement', 1.3), 0.2], [at('escapement', 3.8), 0.2, 'l'], [at('stable', 0.8), 1]],
  aLabels: [[0, 1], [at('escapement', 0.0), 1], [at('escapement', 0.5), 0]],
  aNotes: [[0, 0], [at('energy', 0.3), 0], [at('energy', 0.8), 1], [at('finish', 0.3), 1], [at('finish', 1.3), 0]],
  aEscNote: [[0, 0], [at('escapement', 1.6), 0], [at('escapement', 2.2), 1], [at('escapement', 3.7), 1, 'l'], [at('escapement', 4.2), 0]],
  // Scene 7: case back rises behind, case closes around, dial and hands seat axially, one crystal glint
  aCaseBack: [[0, 0], [at('finish', 0.1), 0], [at('finish', 0.9), 1]],
  caseClose: [[0, 0], [at('finish', 0.3), 0], [at('finish', 1.3), 1, 'c']],
  dialIn:    [[0, 0], [at('finish', 0.9), 0], [at('finish', 1.75), 1, 'c']],
  handsIn:   [[0, 0], [at('finish', 1.45), 0], [at('finish', 2.0), 1, 'c']],
  glass:     [[0, 0], [at('finish', 1.8), 0], [at('finish', 2.5), 1, 'l']],
};
for (const k in TRACKS) TRACKS[k] = TRACKS[k].map(r => ({ t: r[0], v: r[1], e: r[2] || 's' }));
function ev(name, t) {
  const tr = TRACKS[name];
  if (t <= tr[0].t) return tr[0].v;
  for (let i = 1; i < tr.length; i++) {
    const b = tr[i];
    if (t <= b.t) {
      const a = tr[i - 1], u = (t - a.t) / ((b.t - a.t) || 1);
      const w = b.e === 'l' ? u : (b.e === 'c' ? inOut(u) : smoother(u));
      return a.v + (b.v - a.v) * w;
    }
  }
  return tr[tr.length - 1].v;
}

// Scene 2 entrances (exploded space) and scene 3 seating (exploded → assembled), per assembly group.
const E2 = SC.emerge.t0, A3 = SC.assemble.t0;
const ENTRANCE = {
  bridges: { t: E2 + 0.85, d: 1.40, kind: 'draft' },
  barrel:  { t: E2 + 0.90, d: 1.00, kind: 'gear', spin: -1 },   // spin = the arbor's own running direction
  center:  { t: E2 + 1.20, d: 1.00, kind: 'gear', spin: +1 },
  third:   { t: E2 + 1.50, d: 1.00, kind: 'gear', spin: -1 },
  fourth:  { t: E2 + 1.80, d: 1.00, kind: 'gear', spin: +1 },
  escape:  { t: E2 + 2.05, d: 0.90, kind: 'gear', spin: -1 },
  fork:    { t: E2 + 2.40, d: 0.75, kind: 'axial' },             // arrives after the escape wheel has stopped
  balance: { t: E2 + 2.55, d: 1.15, kind: 'balance' },
  hair:    { t: E2 + 2.80, d: 0.90, kind: 'spring' },
  jewels:  { t: E2 + 2.85, d: 0.45, kind: 'jewel', stagger: 0.06 },
  screws:  { t: E2 + 2.95, d: 0.60, kind: 'screw', stagger: 0.055 },
};
const SEAT = { bridges: [A3 + 0.20, 0.7], hair: [A3 + 0.45, 0.7], balance: [A3 + 0.65, 0.7], escape: [A3 + 0.95, 0.7], fourth: [A3 + 1.25, 0.7],
               third: [A3 + 1.55, 0.7], center: [A3 + 1.85, 0.7], barrel: [A3 + 2.15, 0.7], hand: [A3 + 2.45, 0.7] };
const seatEnd = g => SEAT[g][0] + SEAT[g][1];
// Scene 4 power path (diagrammatic): stage 0 = mainspring, then barrel → centre → third → fourth → escape → fork → balance.
const E4 = SC.energy.t0;
const PULSE = { t0: E4 + 0.40, d: [0.30, 0.20, 0.22, 0.22, 0.22, 0.20, 0.20, 0.26], ts: [] };
{ let a = PULSE.t0; for (const d of PULSE.d) { PULSE.ts.push(a); a += d; } PULSE.t1 = a; }
const FF0 = E4 + 2.6;    // fast-forward begins: train-wheel periods appear (right column only)

// Beat clock: B(t) integrated once, deterministically (midpoint rule). After the opening ticks the rate decays to
// zero; a small smooth correction inside that deceleration makes the clock come to rest exactly at B = k + ½
// (balance at the end of its swing, escape wheel locked) so that, once assembled, the balance is released from rest.
const B0 = -0.85, DTB = 1 / 600, DEC = [at('emerge', 0), at('emerge', 1.2)];
let HOLD_BUMP = 0;
const bump = t => (t <= DEC[0] || t >= DEC[1]) ? 0 : 2 / (DEC[1] - DEC[0]) * Math.pow(Math.sin(PI * (t - DEC[0]) / (DEC[1] - DEC[0])), 2);

      for (let j = 0; j < 15; j++) { const toe = polar(TR.escape.R, m.aL + j * TAU / 15), d = polyDist(toe, poly); g = Math.min(g, Math.abs(d)); if (d < -2e-4) { pen++; worst = Math.min(worst, d); } }
      for (let e = 0; e < 4; e++) { const a = poly[e], b = poly[(e + 1) % 4];
        for (let j = 1; j < 12; j++) { const q = vlerp(a, b, j / 12), c = vlerp(q, vlerp(poly[0], poly[2], .5), 0.04), l = vrot(c, -m.aL); if (tctx.isPointInPath(GEO.esc.path, l.x, l.y, 'evenodd')) pen++; } }
      const hp = S.hold.map(p => add(LP, vrot(p, m.psi)));
      for (let j = 0; j < 15; j++) { const toe = polar(TR.escape.R, m.aL + j * TAU / 15); if (polyDist(toe, hp) < 0) pen++; }
      gap[key] = g;
    }
    const bc = add(LP, vrot(FORKG.band.Ef, m.psi));    // bridge must stay outside the tip circle
    const bandClear = vlen(bc) - 0 >= 0 ? (FORKG.band.r0 - TR.escape.R) - vlen(bc) : 0;
    return { pen, worst, gap, bandClear, s: m.s, k: m.k, psi: m.psi / DEG };
  },
};
window.MT = API;
})();
