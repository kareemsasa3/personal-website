<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Observing</title>
<style>
/* Self-hosted in place of Google Fonts; license in fonts/. Same family, weight and display. */
@font-face{font-family:'Share Tech Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ShareTechMono-Regular.woff2) format('woff2')}
</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#010204; --line:rgba(56,242,255,.35); --text:#9feff5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#010204; } }
:root[data-theme="dark"]{ --ink:#010204; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:auto}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:220px;padding:12px 14px;
  background:rgba(2,8,12,.86);border:1px solid var(--line);color:var(--text);
  font:12px/1.5 "Share Tech Mono","DejaVu Sans Mono",ui-monospace,monospace;display:none;z-index:2}
#panel.on{display:block}
#panel label{display:flex;gap:8px;align-items:center;cursor:pointer}
#panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:8px 0}
#panel input[type=range]{width:100%;accent-color:#38f2ff}
#panel button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);padding:2px 8px;cursor:pointer}
#panel button:focus-visible,#panel input:focus-visible{outline:2px solid #38f2ff;outline-offset:2px}
#panel .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
#hint{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));color:rgba(159,239,245,.35);
  font:11px "Share Tech Mono","DejaVu Sans Mono",monospace;pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Animated cyberpunk skyline: an engineer and a small holographic dog on a rainy rooftop"></canvas></div>
<div id="panel" role="region" aria-label="Scene controls">
  <div class="row"><span id="tread">t 0.00</span><button id="bplay">pause</button></div>
  <input id="scrub" type="range" min="0" max="16" step="0.01" value="0" aria-label="Timeline">
  <div class="grid" id="layers"></div>
  <label><input type="checkbox" id="amb"> ambient hold</label>
  <label><input type="checkbox" id="cov"> fill screen</label>
</div>
<div id="hint">D controls · space pause · A ambient · F fill</div>
<script>
'use strict';
/* =========================================================================
   OBSERVING — procedural cyberpunk loop
   World space is 1920x1080. Every scene component below is an independent
   module with its own draw function and a toggle in the D panel.
   ========================================================================= */

const W = 1920, H = 1080, LOOP = 16;

const PAL = {
  ink: '#010204',
  cyan: [56, 242, 255],
  green: [24, 255, 109],
  magenta: [255, 43, 214],
  white: [220, 255, 236],
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* Timeline (seconds). Edit here to retime the piece. */
const TL = {
  tear: [1.35, 2.15],
  reveal: [2.1, 4.9],
  rimOn: [4.8, 6.2],
  abbyGather: 6.45,
  abbyStable: [7.15, 7.95],
  matrix: [8.2, 11.6],
  face: [8.6, 11.9],
  observe: [10.3, 12.15],
  glitch: [12.55, 13.12],
  freeze: [12.74, 12.93],
  fade: [15.25, 16.0],
};
const MICRO = [[2.05, .14, .55], [4.25, .10, .35], [7.32, .16, .45], [9.85, .08, .3], [14.15, .06, .22]];

const FONT = '"Share Tech Mono","DejaVu Sans Mono",ui-monospace,monospace';
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:=+<>*¦';
const GN = GLYPHS.length;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = (x, y) => Math.exp(-(x * x + y * y));
const glyph = n => GLYPHS[((n | 0) % GN + GN) % GN];

/* ---------- state ---------- */
const qs = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {
  T: parseFloat(qs.get('t') || '0') % LOOP, C: 0, paused: false,
  ambient: reduced || qs.has('ambient'), cover: qs.has('fill'),
  freeze: false,
};
if (S.ambient && !qs.has('t')) S.T = 14.6;
const LAYERS = { sky: 1, face: 1, far: 1, fog: 1, codeBG: 1, mid: 1, signs: 1, traffic: 1, near: 1, rain: 1, roof: 1, engineer: 1, abby: 1, codeFG: 1, ui: 1, post: 1 };

/* ---------- canvases ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const fxA = mk(4, 4), fxB = mk(4, 4), prev = mk(4, 4);
const fxActx = fxA.getContext('2d'), fxBctx = fxB.getContext('2d'), prevctx = prev.getContext('2d');
let k = 1, PW = W, PH = H;

function resize() {
  const vw = innerWidth, vh = innerHeight, r = 16 / 9;
  let cw, ch;
  if (S.cover ? vw / vh > r : vw / vh < r) { cw = vw; ch = vw / r; } else { ch = vh; cw = vh * r; }
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2);
  PW = Math.round(Math.min(cw * dpr, 1920)); PH = Math.round(PW / r);
  cv.width = PW; cv.height = PH; k = PW / W;
  for (const c of [fxA, fxB, prev]) { c.width = PW; c.height = PH; }
}

/* ---------- sprites ---------- */
function glowSprite(c) {
  const s = mk(128, 128), g = s.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(c, 1)); gr.addColorStop(.25, rgba(c, .35)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return s;
}
const GLOW = { c: glowSprite(PAL.cyan), m: glowSprite(PAL.magenta), g: glowSprite(PAL.green), w: glowSprite([200, 230, 255]), r: glowSprite([255, 60, 70]) };
const FOG = (() => {
  const s = mk(512, 160), g = s.getContext('2d');
  const gr = g.createRadialGradient(256, 80, 0, 256, 80, 256);
  gr.addColorStop(0, 'rgba(70,120,140,.55)'); gr.addColorStop(.5, 'rgba(45,85,105,.22)'); gr.addColorStop(1, 'rgba(30,60,80,0)');
  g.setTransform(1, 0, 0, 160 / 512, 0, 80 - 80 * 160 / 512 + 0);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512); return s;
})();
const NOISE = [0, 1, 2, 3].map(i => {
  const s = mk(256, 256), g = s.getContext('2d'), d = g.createImageData(256, 256), R = rng(91 + i);
  for (let p = 0; p < d.data.length; p += 4) { const v = R() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = R() < .5 ? 40 : 0; }
  g.putImageData(d, 0, 0); return s;
});
const SCAN = (() => { const s = mk(2, 3), g = s.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 1, 2, 1); return s; })();
const VIGNETTE = (() => {
  const s = mk(W / 4, H / 4), g = s.getContext('2d');
  const gr = g.createRadialGradient(W / 8, H / 8 * .95, H / 16, W / 8, H / 8, W / 7.2);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.7, 'rgba(0,0,0,.25)'); gr.addColorStop(1, 'rgba(0,0,0,.82)');
  g.fillStyle = gr; g.fillRect(0, 0, W / 4, H / 4); return s;
})();

/* =========================================================================
   CAMERA — slow push with depth-scaled parallax
   ========================================================================= */
const FX = 900, FY = 640;
const cam = { push: 0, sx: 0, sy: 0 };
function updateCam(T, C) {
  cam.push = .05 * easeIO(clamp((T - 2) / 13));
  cam.sx = Math.sin(C * .11) * 7 + Math.sin(C * .043) * 4;
  cam.sy = Math.sin(C * .07) * 3;
}
function layer(d) {
  const s = 1 + cam.push * d;
  ctx.setTransform(k * s, 0, 0, k * s, k * (FX - FX * s + cam.sx * d), k * (FY - FY * s + cam.sy * d));
}
const toScreenY = (y, d) => FY + (y - FY) * (1 + cam.push * d) + cam.sy * d;
const screen = () => ctx.setTransform(k, 0, 0, k, 0, 0);

/* =========================================================================
   SKYLINE — procedural, seeded, pre-rendered per depth layer
   ========================================================================= */
const BASE = 900;
function bPath(c, b) {
  const { x, w, top } = b; c.beginPath();
  switch (b.type) {
    case 'round': { const r = w * .34; c.moveTo(x, BASE); c.lineTo(x, top + r); c.quadraticCurveTo(x, top, x + r, top); c.lineTo(x + w - r, top); c.quadraticCurveTo(x + w, top, x + w, top + r); c.lineTo(x + w, BASE); break; }
    case 'pent': { const q = w * .2; c.moveTo(x, BASE); c.lineTo(x, top + q); c.lineTo(x + q, top); c.lineTo(x + w - q, top); c.lineTo(x + w, top + q); c.lineTo(x + w, BASE); break; }
    case 'slopeL': c.moveTo(x, BASE); c.lineTo(x, top + w * .7); c.lineTo(x + w, top); c.lineTo(x + w, BASE); break;
    case 'slopeR': c.moveTo(x, BASE); c.lineTo(x, top); c.lineTo(x + w, top + w * .7); c.lineTo(x + w, BASE); break;
    case 'gable': {
      const steps = [[0, 120], [.13, 84], [.27, 48], [.4, 16]];
      c.moveTo(x, BASE);
      for (const [f, dy] of steps) { c.lineTo(x + f * w, top + dy); c.lineTo(x + f * w + w * .035, top + dy - 10); c.lineTo(x + f * w + w * .07, top + dy); }
      c.lineTo(x + w / 2, top - 8);
      for (let i = steps.length - 1; i >= 0; i--) { const [f, dy] = steps[i]; c.lineTo(x + w - f * w - w * .07, top + dy); c.lineTo(x + w - f * w - w * .035, top + dy - 10); c.lineTo(x + w - f * w, top + dy); }
      c.lineTo(x + w, BASE); break;
    }
    case 'beacon': c.moveTo(x, BASE); c.lineTo(x, top + 26); c.lineTo(x + w * .5, top); c.lineTo(x + w, top + 26); c.lineTo(x + w, BASE); break;
    default: c.rect(x, top, w, BASE - top);
  }
  c.closePath();
}

const SKY = (() => {
  const R = rng(1971);
  const far = [], mid = [], near = [];
  // far — dense, hazy, low
  for (let x = -140; x < 2060;) {
    const w = 26 + R() * 64; let top = 585 + R() * 190;
    if (x > 400 && x < 720) top = Math.max(top, 712 + R() * 40);
    far.push({ x, w, top, type: R() < .14 ? 'spire' : 'rect', lit: .07 + R() * .1 });
    x += w - 4 + R() * 10;
  }
  // mid — infill first, landmarks after (drawn on top)
  for (let x = -120; x < 2060;) {
    const w = 50 + R() * 80; let top = 440 + R() * 250;
    if (x + w > 430 && x < 680) top = Math.max(top, 700 + R() * 30);
    if (x > 1060 && x < 1620) top = Math.max(top, 520 + R() * 120);
    mid.push({ x, w, top, type: R() < .2 ? 'pent' : 'rect', lit: .1 + R() * .16 });
    x += w + 10 + R() * 50;
  }
  const marks = [
    { x: 690, w: 116, top: 372, type: 'round', lit: .22 },
    { x: 818, w: 114, top: 286, type: 'pent', lit: .2, crown: true },
    { x: 1004, w: 72, top: 432, type: 'slopeL', lit: .18 },
    { x: 1082, w: 72, top: 432, type: 'slopeR', lit: .18 },
    { x: 352, w: 60, top: 322, type: 'beacon', lit: .14, beacon: true },
    { x: 1468, w: 128, top: 404, type: 'gable', lit: .2 },
  ];
  mid.push(...marks);
  // near — framing masses
  near.push({ x: -70, w: 480, top: 652, type: 'rect', lit: .12, bands: true });
  near.push({ x: 1352, w: 196, top: 616, type: 'rect', lit: .14, bands: true });
  near.push({ x: 1636, w: 330, top: 136, type: 'rect', lit: .1, bands: true });
  for (let x = 760; x < 1340;) { const w = 80 + R() * 120; near.push({ x, w, top: 770 + R() * 70, type: 'rect', lit: .1 }); x += w + 20 + R() * 60; }
  return { far, mid, near, marks };
})();

function renderLayer(list, opt) {
  const c = mk(W, H), g = c.getContext('2d'), R = rng(opt.seed);
  for (const b of list) {
    bPath(g, b);
    const gr = g.createLinearGradient(0, b.top, 0, BASE);
    gr.addColorStop(0, opt.top); gr.addColorStop(1, opt.bot);
    g.fillStyle = gr; g.fill();
    g.save(); bPath(g, b); g.clip();
    // windows
    const [ww, wh, sx, sy] = opt.win;
    for (let y = b.top + sy; y < BASE - 10; y += sy) {
      const rowLit = R() < .75 ? b.lit : b.lit * 3;
      for (let x = b.x + 4; x < b.x + b.w - ww - 2; x += sx) {
        if (R() < rowLit) {
          const t = R(); const col = t < .62 ? [170, 225, 255] : t < .9 ? [255, 210, 150] : [120, 255, 180];
          g.fillStyle = rgba(col, .18 + R() * opt.winA); g.fillRect(x, y, ww, wh);
        }
      }
    }
    if (b.bands) { g.fillStyle = 'rgba(120,200,230,.05)'; for (let y = b.top + 30; y < BASE; y += 46) g.fillRect(b.x, y, b.w, 2); }
    // rim light on the right edge (city glow)
    g.strokeStyle = rgba(PAL.cyan, opt.rim); g.lineWidth = 3; bPath(g, b); g.stroke();
    g.restore();
  }
  if (opt.haze) {
    g.globalCompositeOperation = 'source-atop';
    const hz = g.createLinearGradient(0, 520, 0, BASE);
    hz.addColorStop(0, 'rgba(25,50,66,0)'); hz.addColorStop(1, opt.haze);
    g.fillStyle = hz; g.fillRect(0, 0, W, H);
  }
  return c;
}
const LAYER_IMG = {
  far: renderLayer(SKY.far, { seed: 11, top: '#0b1620', bot: '#081018', win: [2, 2, 6, 8], winA: .35, rim: .05, haze: 'rgba(40,78,96,.55)' }),
  mid: renderLayer(SKY.mid, { seed: 12, top: '#060c13', bot: '#04080d', win: [3, 4, 8, 11], winA: .55, rim: .1, haze: 'rgba(30,62,80,.42)' }),
  near: renderLayer(SKY.near, { seed: 13, top: '#03060a', bot: '#020407', win: [4, 6, 13, 17], winA: .5, rim: .14, haze: 'rgba(20,40,52,.25)' }),
};
const ANTENNAS = [];
{
  const R = rng(5);
  for (const b of SKY.far) if (b.type === 'spire') ANTENNAS.push({ x: b.x + b.w / 2, y: b.top - 30, h: 30, d: .15, ph: R() * 2 });
  for (const b of SKY.marks) if (b.type === 'round' || b.type === 'gable') ANTENNAS.push({ x: b.x + b.w / 2, y: b.top - (b.type === 'gable' ? 44 : 40), h: 40, d: .35, ph: R() * 2 });
}

/* =========================================================================
   SKY + HORIZON GLOW
   ========================================================================= */
const SKY_IMG = (() => {
  const c = mk(W / 2, H / 2), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H / 2);
  gr.addColorStop(0, '#010205'); gr.addColorStop(.45, '#040a10'); gr.addColorStop(.72, '#0b1b24'); gr.addColorStop(.84, '#12262e'); gr.addColorStop(1, '#0a141a');
  g.fillStyle = gr; g.fillRect(0, 0, W / 2, H / 2);
  const m = g.createRadialGradient(W * .12, H * .38, 0, W * .12, H * .38, W * .3);
  m.addColorStop(0, 'rgba(120,20,110,.16)'); m.addColorStop(1, 'rgba(120,20,110,0)');
  g.fillStyle = m; g.fillRect(0, 0, W / 2, H / 2);
  return c;
})();
function drawSky() { screen(); ctx.drawImage(SKY_IMG, -20, -20, W + 40, H + 40); }

/* =========================================================================
   AI PRESENCE — relief-shaded face built from glyphs
   ========================================================================= */
const FACE = (() => {
  const cx = 1338, cy = 318, fw = 520, fh = 640, cell = 13;
  const cells = [];
  const z = (u, v) => {
    let rx = .8 * Math.sqrt(Math.max(0, 1 - v * v)); if (v > .15) rx *= 1 - .42 * (v - .15);
    if (Math.abs(u) > rx) return null;
    let h = Math.sqrt(Math.max(0, 1 - (u / Math.max(rx, .01)) ** 2)) * .8;
    h -= .38 * gauss((Math.abs(u) - .29) / .12, (v + .08) / .07);
    h += .14 * gauss(u / .55, (v + .19) / .045);
    h += .32 * gauss(u / .07, (v - .1) / .17);
    h -= .2 * gauss(u / .2, (v - .42) / .022);
    h += .09 * gauss((Math.abs(u) - .33) / .12, (v - .17) / .1);
    return { h, rx };
  };
  const L = [.25, .62, .74]; const ln = Math.hypot(...L);
  for (let y = -fh / 2; y < fh / 2; y += cell) for (let x = -fw / 2; x < fw / 2; x += cell) {
    const u = x / (fw / 2), v = y / (fh / 2), a = z(u, v); if (!a) continue;
    const e = .02, ax = z(u + e, v), ay = z(u, v + e); if (!ax || !ay) continue;
    const nx = -(ax.h - a.h) / e, ny = -(ay.h - a.h) / e, nl = Math.hypot(nx, ny, 1);
    const lam = Math.max(0, (nx * L[0] + ny * L[1] + L[2]) / (nl * ln));
    const contour = Math.pow(1 - Math.abs((a.h * 7) % 1 - .5) * 2, 6);
    const edgeIn = a.rx - Math.abs(u);
    const edge = smooth(0, .06, edgeIn) * smooth(-1, -.78, v);
    const rimL = 1 - smooth(.02, .14, edgeIn);
    const eyeD = gauss((Math.abs(u) - .29) / .11, (v + .08) / .06);
    const dark = (1 - .95 * eyeD) * (1 - .8 * gauss(u / .2, (v - .42) / .03)) * (1 - .6 * gauss(u / .12, (v - .3) / .04));
    let b = (.08 + .62 * Math.pow(lam, 1.6) + .45 * rimL + .12 * contour) * dark * edge;
    if (b < .1) continue;
    const i = cells.length;
    cells.push({ x: cx + x, y: cy + y, b, th: hash(i * 3.7) * .8 + (1 - (v + 1) / 2) * .2, gs: hash(i + 9) < .3 ? 6 : .6, g0: hash(i) * 99 });
  }
  return { cx, cy, fw, fh, cells, eyes: [[cx - .29 * fw / 2, cy - .08 * fh / 2], [cx + .29 * fw / 2, cy - .08 * fh / 2]] };
})();
function faceAmt(T) { return smooth(TL.face[0], TL.face[1], T) * (1 - smooth(TL.fade[0], TL.fade[1] - .2, T)); }
function drawFace(T, C, gl) {
  const e = faceAmt(T); if (e <= 0) return;
  layer(.1);
  const bob = Math.sin(C * .35) * 6, sc = 1 + Math.sin(C * .5) * .006;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .11 * e; ctx.drawImage(GLOW.g, FACE.cx - 360, FACE.cy - 380 + bob, 720, 760);
  ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const boost = 1 + gl * 1.4;
  const rowJ = Math.floor(C * 9);
  for (const c of FACE.cells) {
    const vis = smooth(c.th, c.th + .16, e); if (vis <= 0) continue;
    let a = c.b * vis * .62 * boost; if (a < .02) continue;
    let ox = 0; const row = Math.round(c.y / 13);
    if (hash(row * 1.3 + rowJ) > .985) ox = (hash(row + rowJ) - .5) * 30;
    if (gl > 0 && hash(row * 7 + rowJ) > .6) ox += (hash(row * 3 + rowJ) - .5) * 160 * gl;
    ctx.globalAlpha = Math.min(1, a);
    ctx.fillStyle = c.b > .62 ? '#c8ffe6' : c.b > .35 ? '#3dff92' : '#18c86a';
    const y = FACE.cy + (c.y - FACE.cy) * sc + bob;
    ctx.fillText(glyph(c.g0 + C * c.gs), c.x + ox, y);
  }
  // eyes — late, faint, slightly wrong
  const eo = smooth(11.0, 12.3, T) * (1 - smooth(TL.fade[0], TL.fade[1] - .3, T));
  if (eo > 0) {

  const by = ((C * .09) % 1.3) * H - 100;
  const bg = ctx.createLinearGradient(0, by - 90, 0, by + 90); bg.addColorStop(0, 'rgba(120,200,220,0)'); bg.addColorStop(.5, 'rgba(120,200,220,.035)'); bg.addColorStop(1, 'rgba(120,200,220,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, by - 90, W, 180);
  ctx.globalAlpha = .3; const np = ctx.createPattern(NOISE[Math.floor(C * 24) % 4], 'repeat'); ctx.fillStyle = np;
  ctx.setTransform(k, 0, 0, k, (hash(Math.floor(C * 24)) * 256 * k) | 0, 0); ctx.fillRect(-256, 0, W + 256, H);
  screen(); ctx.globalAlpha = 1; ctx.drawImage(VIGNETTE, 0, 0, W, H);
}

/* =========================================================================
   FRAME
   ========================================================================= */
function update(dt) {
  if (!S.paused) {
    S.C += dt;
    S.T += dt;
    if (S.ambient) { if (S.T > 14.6) S.T = 14.6; }
    else if (S.T >= LOOP) S.T -= LOOP;
  }
  const T = S.T;
  S.freeze = T > TL.freeze[0] && T < TL.freeze[1];
  const d = S.paused || S.freeze ? 0 : dt;
  const ci = codeIntensity(T);
  CODE_BG.update(d, ci);
  CODE_FG.update(d, ci > .5 ? (ci - .5) * 2 : 0.08 * smooth(3, 5, T));
  updateRain(d);
}

function render() {
  const T = S.T, C = S.C;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, PW, PH);
  updateCam(T, C);
  const mp = majorPhase(T), gl = mp >= 0 ? Math.sin(Math.PI * Math.min(1, mp * 1.15)) : 0;
  const lit = smooth(TL.rimOn[0] - .2, TL.rimOn[1], T);
  const ci = codeIntensity(T);

  if (LAYERS.sky) drawSky();
  if (LAYERS.face) drawFace(T, C, gl);
  if (LAYERS.fog) drawFog(0, C, 1);
  if (LAYERS.far) { layer(.15); ctx.drawImage(LAYER_IMG.far, 0, 0); drawAntennas(.15, C, smooth(3, 4, T)); }
  if (LAYERS.fog) drawFog(1, C, 1);
  if (LAYERS.codeBG) { layer(.25); CODE_BG.draw(.42); }
  if (LAYERS.signs) drawBeacon(T, C);
  if (LAYERS.mid) { layer(.35); ctx.drawImage(LAYER_IMG.mid, 0, 0); drawAntennas(.35, C, smooth(3, 4, T)); }
  if (LAYERS.codeBG) drawFacadeCode(T, C);
  if (LAYERS.signs) for (const s of SIGNS) if (s.d < .5) drawSign(s, T, C);
  if (LAYERS.traffic) drawTraffic(0, T, C);
  if (LAYERS.fog) drawFog(2, C, 1);
  if (LAYERS.near) { layer(.6); ctx.drawImage(LAYER_IMG.near, 0, 0); }
  if (LAYERS.signs) for (const s of SIGNS) if (s.d >= .5) drawSign(s, T, C);
  if (LAYERS.traffic) drawTraffic(1, T, C);
  if (LAYERS.rain) drawRain(false, smooth(2.4, 4.8, T));
  if (LAYERS.roof) drawRoof(T, C, lit);
  if (LAYERS.engineer) drawEngineerReflection(C, lit);
  if (LAYERS.abby) drawAbby(T, C, true);
  if (LAYERS.engineer) drawEngineer(T, C, lit);
  if (LAYERS.abby) drawAbby(T, C, false);
  if (LAYERS.codeFG) { screen(); CODE_FG.draw(.38); }
  if (LAYERS.rain) drawRain(true, smooth(2.4, 4.8, T));
  if (LAYERS.ui) drawUI(T, C, gl);

  if (LAYERS.post) {
    revealMask(T, C);
    const ma = microAmt(T);
    if (ma > 0) { slices(3 + Math.floor(ma * 6), 60 * ma, Math.floor(T * 40)); if (ma > .3) rgbSplit(Math.round(5 * ma * k)); }
    if (mp >= 0) {
      const seed = Math.floor(T * 26);
      if (mp > .1) corrupt(seed, mp);
      slices(mp < .12 ? 3 : 12, mp < .12 ? 20 : 140 * (1 - mp * .5), seed);
      rgbSplit(Math.round((mp < .12 ? 4 : 16 - 8 * mp) * k));
    }
    terminal(T, C);
    crt(T, C);
    if (T > TL.glitch[1] && T < TL.glitch[1] + .05) { screen(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(56,242,255,.5)'; ctx.fillRect(0, 539, W, 2); ctx.globalCompositeOperation = 'source-over'; }
    if (T > TL.glitch[0] - .3 && T < TL.glitch[1]) { ctx.setTransform(1, 0, 0, 1, 0, 0); copyTo(prevctx, cv); }
  } else terminal(T, C);
}

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  update(dt); render(); panelTick();
  requestAnimationFrame(frame);
}

/* =========================================================================
   CONTROLS
   ========================================================================= */
const panel = document.getElementById('panel'), scrub = document.getElementById('scrub'), tread = document.getElementById('tread'), bplay = document.getElementById('bplay');
const lgrid = document.getElementById('layers');
for (const key of Object.keys(LAYERS)) {
  const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" checked> ${key}`;
  l.querySelector('input').addEventListener('change', e => LAYERS[key] = e.target.checked ? 1 : 0); lgrid.appendChild(l);
}
const amb = document.getElementById('amb'), cov = document.getElementById('cov');
amb.checked = S.ambient; cov.checked = S.cover;
amb.addEventListener('change', () => { S.ambient = amb.checked; if (S.ambient && S.T < 14.6) S.T = 14.6; });
cov.addEventListener('change', () => { S.cover = cov.checked; resize(); });
scrub.addEventListener('input', () => { S.T = parseFloat(scrub.value); });
bplay.addEventListener('click', () => { S.paused = !S.paused; });
function panelTick() { if (!panel.classList.contains('on')) return; tread.textContent = `t ${S.T.toFixed(2)}`; if (document.activeElement !== scrub) scrub.value = S.T; bplay.textContent = S.paused ? 'play' : 'pause'; }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== 'Escape') return;
  const key = e.key.toLowerCase();
  if (key === ' ') { S.paused = !S.paused; e.preventDefault(); }
  else if (key === 'd') panel.classList.toggle('on');
  else if (key === 'a') { amb.checked = !amb.checked; amb.dispatchEvent(new Event('change')); }
  else if (key === 'f') { cov.checked = !cov.checked; cov.dispatchEvent(new Event('change')); }
  else if (key === 'r') S.T = 0;
});
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);
addEventListener('resize', resize);
window.__seek = t => { S.T = t; };
resize();
requestAnimationFrame(frame);
</script>
