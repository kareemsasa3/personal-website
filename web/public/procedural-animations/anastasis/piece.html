<style>
:root{
  --bg:#030403; --ink:#e9ebf3; --ink-dim:#9aa1ba; --ink-faint:#646a82;
  --violet:#8c6bff; --blue:#4f8bff; --line:rgba(205,210,238,.18); --line-strong:rgba(215,220,245,.42);
  --display:"Michroma","Eurostile","Microgramma","Arial Black",sans-serif;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#030403; --ink:#e9ebf3; --ink-dim:#9aa1ba; --line:rgba(205,210,238,.18); }
}
:root[data-theme="dark"]{ --bg:#030403; --ink:#e9ebf3; --ink-dim:#9aa1ba; --line:rgba(205,210,238,.18); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* component labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.lbl .dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px rgba(140,107,255,.30),0 0 14px rgba(120,140,255,.55)}
.lbl .lead{position:absolute;left:0;top:0;width:96px;height:1px;transform-origin:0 0;transform:rotate(-36deg);background:linear-gradient(90deg,rgba(233,235,243,.75),rgba(233,235,243,.18))}
.lbl .txt{position:absolute;left:82px;top:-90px;padding:5px 9px 6px;border-radius:4px;background:rgba(7,11,8,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap;text-shadow:0 1px 14px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
.lbl.flip .lead{transform:rotate(-144deg)}
.lbl.flip .txt{left:auto;right:82px;text-align:right}
.lbl .nm{font-family:var(--display);font-size:11.5px;letter-spacing:.035em;color:var(--ink);line-height:1.35}
.lbl .rl{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink-dim);line-height:1.2}
.lbl.small .nm{font-size:10.5px}
.lbl.small .rl{font-size:14px}
.lbl .txt{transition:left .35s ease,top .35s ease}
.lbl .lead{transition:transform .35s ease,width .35s ease}
.lbl.snap .txt,.lbl.snap .lead{transition:none!important}
.lbl .sh{display:none;font-family:var(--display);font-size:10.5px;letter-spacing:.035em;color:var(--ink);line-height:1.35}
.lbl.compact .rl,.lbl.compact .nm{display:none}
.lbl.compact .sh{display:block}
.lbl.compact .txt,.lbl.nameonly .txt{padding:3px 7px 4px}
.lbl.nameonly .rl{display:none}

/* title */
#title{position:fixed;left:clamp(22px,6vw,92px);bottom:calc(118px + env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;max-width:min(92vw,980px)}
#title h1{--ls:.62em;--sweep:-20;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,4.8vw,72px);line-height:1;letter-spacing:var(--ls);margin-right:calc(var(--ls) * -1);
  color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,#f2f3f8 0%,#f2f3f8 calc(var(--sweep) * 1% - 16%),#c3b5ff calc(var(--sweep) * 1% - 5%),#86b6ff calc(var(--sweep) * 1%),#f2f3f8 calc(var(--sweep) * 1% + 13%),#f2f3f8 100%);
  filter:drop-shadow(0 0 28px rgba(110,100,255,.28))}
#title .tag{margin:.55em 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(19px,2.3vw,31px);color:#cfd3e4;opacity:0}
#title .spec{margin:1.3em 0 0;font-family:var(--display);font-size:10.5px;letter-spacing:.07em;color:var(--ink-dim);opacity:0}

/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;padding:26px clamp(14px,3.4vw,40px) calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(to top,rgba(3,4,3,.92) 0%,rgba(3,4,3,.62) 55%,rgba(3,4,3,0) 100%)}
#bar button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
#bar button:hover{border-color:var(--line-strong);background:rgba(255,255,255,.04)}
#bar button:focus-visible,#scrub:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
.ic svg{width:16px;height:16px;fill:currentColor}
.tb{height:34px;padding:0 14px;border-radius:17px;font-family:var(--display)!important;font-size:10px!important;letter-spacing:.06em;flex:none;white-space:nowrap}
.tb[aria-pressed="true"]{border-color:rgba(140,107,255,.75)!important;background:rgba(140,107,255,.12)!important}
#stageName{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);min-width:118px;white-space:nowrap;flex:none}
.track{position:relative;flex:1 1 auto;min-width:120px;height:40px;display:flex;align-items:center}
#scrub{--p:0%;-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:1}
#scrub::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--violet) 0%,var(--blue) var(--p),rgba(205,210,238,.2) var(--p))}
#scrub::-moz-range-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--violet) 0%,var(--blue) var(--p),rgba(205,210,238,.2) var(--p))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 0 0 4px rgba(140,107,255,.25)}
#scrub::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 0 0 4px rgba(140,107,255,.25)}
#ticks{position:absolute;left:6px;right:6px;top:50%;height:0;pointer-events:none}
#ticks i{position:absolute;top:-7px;width:1px;height:5px;background:rgba(215,220,245,.38)}
#time{font-family:var(--display);font-size:10.5px;letter-spacing:.05em;color:var(--ink-dim);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
#hint{position:fixed;right:clamp(14px,3.4vw,40px);top:calc(22px + env(safe-area-inset-top,0px));font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-dim);opacity:0;transition:opacity .8s;pointer-events:none}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
#err[hidden]{display:none}
#err h2{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.08em;margin:0 0 10px}
#err p{font-family:var(--serif);font-size:19px;color:var(--ink-dim);max-width:44ch;margin:0 auto}

@media (max-width:760px){
  #bar{flex-wrap:wrap;gap:10px 10px;padding-top:30px}
  .track{order:-1;flex:1 1 100%;height:28px}
  #stageName{min-width:0;font-size:16px;flex:1 1 auto}
  #time{min-width:0}
  .tb{padding:0 11px}
  #title{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #hint{display:none}
}
@media (max-aspect-ratio:9/10){
  #title{left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:auto;text-align:center;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){ #hint{transition:none} }
</style>
</head>
<body>
<div id="stage" aria-label="Animated 3D assembly of the ANASTASIS workstation" role="img"></div>
<div id="labels" aria-hidden="true"></div>
<div id="title" aria-live="polite">
  <h1>ANASTASIS</h1>
  <p class="tag">Built to compute. Built to endure.</p>
  <p class="spec">Core i7-8700K, GeForce RTX 5070, Arch Linux</p>
</div>
<div id="hint">Drag to orbit the workstation</div>
<div id="bar" role="group" aria-label="Playback controls">
  <button id="play" class="ic" type="button" aria-label="Pause">
    <svg id="icoPause" viewBox="0 0 16 16"><rect x="3" y="2" width="3.4" height="12" rx="1"/><rect x="9.6" y="2" width="3.4" height="12" rx="1"/></svg>
    <svg id="icoPlay" viewBox="0 0 16 16" style="display:none"><path d="M4 2.2v11.6c0 .6.6.9 1.1.6l9-5.8c.5-.3.5-.9 0-1.2l-9-5.8C4.6 1.3 4 1.6 4 2.2z"/></svg>
  </button>
  <button id="restart" class="ic" type="button" aria-label="Restart">
    <svg viewBox="0 0 16 16"><path d="M8 3V.8L4.4 4 8 7.2V5a3.6 3.6 0 1 1-3.6 3.6H2.4A5.6 5.6 0 1 0 8 3z"/></svg>
  </button>
  <span id="stageName">Chassis</span>
  <div class="track"><div id="ticks"></div><input id="scrub" type="range" min="0" max="40" step="0.01" value="0" aria-label="Timeline"></div>
  <span id="time">0:00 / 0:40</span>
  <button id="speed" class="tb" type="button" aria-label="Playback speed 1×">1×</button>
  <button id="explode" class="tb" type="button" aria-pressed="false">Exploded view</button>
  <button id="cam" class="tb" type="button" aria-pressed="true">Cinematic camera</button>
</div>
<div id="err" hidden><div><h2>Assembly view unavailable</h2><p></p></div></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
function fail(msg){var e=$('#err');e.hidden=false;e.querySelector('p').textContent=msg;$('#bar').hidden=true;}
if(!window.THREE){fail('The 3D engine did not load. Check your connection, then reload the page.');return;}
var T=window.THREE;
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- math ---------- */
function clamp(x,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(a,b,x){var t=clamp((x-a)/(b-a));return t*t*(3-2*t);}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeSettle(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- renderer ---------- */
var renderer;
try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){fail('WebGL is not available in this browser. Turn on hardware acceleration, then reload.');return;}
$('#stage').appendChild(renderer.domElement);
renderer.domElement.tabIndex=-1;
var PR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.setClearColor(0x030403,1);
var scene=new T.Scene();
scene.fog=new T.FogExp2(0x090b09,0.0034);
var camera=new T.PerspectiveCamera(30,1,1,4000);
if(T.RoomEnvironment){try{var pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(new T.RoomEnvironment(),0.04).texture;pm.dispose();}catch(e){}}

/* ---------- materials & textures ---------- */
var MATS=[];
function lin(p){if(typeof p.color==='number')p.color=new T.Color(p.color).convertSRGBToLinear();return p;}
function std(p,env){var m=new T.MeshStandardMaterial(lin(p));m.userData.env=env===undefined?.6:env;MATS.push(m);return m;}
function phys(p,env){var m=new T.MeshPhysicalMaterial(lin(p));m.userData.env=env===undefined?.6:env;MATS.push(m);return m;}
function LC(hex){return new T.Color(hex).convertSRGBToLinear();}
function glowMat(hex){var m=new T.MeshBasicMaterial({color:LC(hex),toneMapped:false});m.userData.base=m.color.clone();return m;}
var maxAniso=renderer.capabilities.getMaxAnisotropy();
function canvasTex(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=maxAniso;return t;}

var pcbTex=canvasTex(1024,1280,function(x,w,h){
  x.fillStyle='#15171c';x.fillRect(0,0,w,h);var R=rng(11),i,k;
  x.save();x.beginPath();x.rect(560,690,464,590);x.clip();x.strokeStyle='rgba(255,255,255,0.045)';x.lineWidth=7;
  for(i=-1400;i<1500;i+=24){x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();}x.restore();
  x.strokeStyle='rgba(120,132,156,0.11)';x.lineWidth=2;
  for(i=0;i<300;i++){var px=R()*w,py=R()*h;x.beginPath();x.moveTo(px,py);for(k=0;k<4;k++){if(R()<.5)px+=(R()-.5)*240;else py+=(R()-.5)*240;x.lineTo(px,py);}x.stroke();}
  x.strokeStyle='rgba(228,231,240,0.22)';x.lineWidth=1.5;for(i=0;i<80;i++)x.strokeRect(R()*1000,R()*1250,10+R()*36,8+R()*24);
  x.fillStyle='rgba(228,231,240,0.16)';for(i=0;i<160;i++)x.fillRect(R()*1010,R()*1270,6,3);
});
var socketTex=canvasTex(256,256,function(x,w,h){x.fillStyle='#232328';x.fillRect(0,0,w,h);x.fillStyle='#b8933f';
  for(var yy=6;yy<h;yy+=6)for(var xx=6;xx<w;xx+=6){if(xx>88&&xx<168&&yy>88&&yy<168)continue;x.beginPath();x.arc(xx+(yy%12?3:0),yy,1.3,0,7);x.fill();}});
var braidTex=canvasTex(64,64,function(x){x.fillStyle='#16171c';x.fillRect(0,0,64,64);x.lineWidth=5;x.strokeStyle='#23252c';
  for(var i=-64;i<128;i+=11){x.beginPath();x.moveTo(i,0);x.lineTo(i+64,64);x.stroke();}x.strokeStyle='#0d0e11';x.lineWidth=2;for(i=-64;i<128;i+=11){x.beginPath();x.moveTo(i+64,0);x.lineTo(i,64);x.stroke();}});
braidTex.wrapS=braidTex.wrapT=T.RepeatWrapping;braidTex.repeat.set(90,1);
var meshTex=canvasTex(64,64,function(x){x.fillStyle='#0b0c10';x.fillRect(0,0,64,64);x.fillStyle='#2b2e37';
  for(var yy=4;yy<64;yy+=8)for(var xx=4;xx<64;xx+=8){x.beginPath();x.arc(xx+((yy-4)/8%2?4:0),yy,2.1,0,7);x.fill();}});
meshTex.wrapS=meshTex.wrapT=T.RepeatWrapping;meshTex.repeat.set(5,19);
var ventTex=canvasTex(256,64,function(x){x.fillStyle='#121317';x.fillRect(0,0,256,64);x.fillStyle='#8f95a0';for(var i=0;i<8;i++)x.fillRect(24+i*27,18,15,28);});
var psuTopTex=canvasTex(512,480,function(x){x.fillStyle='#eceef2';x.fillRect(0,0,512,480);
  x.save();x.beginPath();x.rect(40,34,432,412);x.clip();x.fillStyle='#d5d8de';x.fillRect(40,34,432,412);
  x.strokeStyle='#26282e';x.lineWidth=7;for(var i=-500;i<1000;i+=17){x.beginPath();x.moveTo(i,34);x.lineTo(i+250,446);x.stroke();}x.restore();
  x.strokeStyle='#c4c8cf';x.lineWidth=12;x.beginPath();x.arc(256,240,152,0,7);x.stroke();
  x.fillStyle='#e9ebef';x.beginPath();x.arc(256,240,44,0,7);x.fill();});
var glowTex=canvasTex(256,256,function(x){var g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(150,120,255,0.9)');g.addColorStop(.35,'rgba(95,110,255,0.35)');g.addColorStop(1,'rgba(40,50,120,0)');x.fillStyle=g;x.fillRect(0,0,256,256);});

var M={
  white:phys({color:0xedeff3,roughness:.4,metalness:0,clearcoat:.4,clearcoatRoughness:.3},.55),
  whiteSoft:std({color:0xe1e4e9,roughness:.6},.45),
  emboss:std({color:0xc9cdd4,roughness:.5},.45),
  cavity:std({color:0x16171b,roughness:.8},.15),
  fin:std({color:0xe8eaee,roughness:.36,metalness:.25},.6),
  chrome:std({color:0xd9dde4,roughness:.16,metalness:1},1),
  nickel:std({color:0x6e737a,roughness:.5,metalness:1},.25),
  silver:std({color:0xc8ccd4,roughness:.3,metalness:.85},.8),
  silverLight:std({color:0xdfe2e7,roughness:.32,metalness:.55},.75),
  ioShroud:std({color:0x8a9098,roughness:.4,metalness:.85},.75) /* Z370-E rear-I/O shroud only: metallic silver-grey (photos 6693, 6694, 6698) */,
  gun:std({color:0x30343c,roughness:.42,metalness:.75},.7),
  gunDark:std({color:0x1f2228,roughness:.36,metalness:.7},.7),
  plastic:std({color:0x18191e,roughness:.55},.35),
  slotGrey:std({color:0x50545d,roughness:.5,metalness:.1},.35),
  black:std({color:0x0d0e11,roughness:.5,metalness:.1},.3),
  pcbEdge:std({color:0x1b1d22,roughness:.6},.3),
  pcbGreen:std({color:0x18301f,roughness:.6},.3),
  gold:std({color:0xd1a64c,roughness:.28,metalness:1},1),
  ihs:std({color:0xc3c8cf,roughness:.32,metalness:1},1),
  ram:std({color:0x1d1e23,roughness:.4,metalness:.55},.6),
  ramFin:std({color:0xa9aeb7,roughness:.3,metalness:.9},.8),
  cap:std({color:0x2a2b30,roughness:.35,metalness:.6},.6),
  fanFrame:std({color:0x121317,roughness:.48,metalness:.05},.4),
  fanBlade:std({color:0x0f1013,roughness:.36,side:T.DoubleSide},.4),
  whiteBlade:std({color:0xe6e8ec,roughness:.5,side:T.DoubleSide},.45),
  gpuBlade:std({color:0xdadde3,roughness:.45,side:T.DoubleSide},.45),
  gpuFin:std({color:0x0b0b0d,roughness:.85,metalness:0},.1), /* dark, matte GPU heatsink fins matching their observed appearance (photo one.png); low environment reflection */
  rubber:std({color:0x101114,roughness:.85},.15),
  mesh:std({color:0xffffff,map:meshTex,roughness:.7,metalness:.3},.2),
  vent:std({color:0xffffff,map:ventTex,roughness:.5,metalness:.3},.3),
  psuTop:std({color:0xffffff,map:psuTopTex,roughness:.5},.45),

      cr.push('('+x.toFixed(1)+','+y.toFixed(1)+') '+where);}}return 'cable'+ci+': '+cr.join(' | ');});};
window.__anastasisWho=function(name,tt){var parts={ssd1:ssd1,ssd2:ssd2,fanB:fanB.group},o=parts[name];applyScene(tt);root.updateMatrixWorld(true);var who={},A=_tris([o]);
  root.children.forEach(function(c,ci){if(c===o||c===glow||!c.visible)return;c.traverseVisible(function(m){if(!m.isMesh)return;var S=_tris([m]);if(!S.length)return;

window.__anastasisCableClash=function(ev){var y0=root.position.y;root.position.y=0;Et=E=ev;applyScene(DUR);root.updateMatrixWorld(true);var out=[];
  CABLES.forEach(function(c,ci){var A=[];c.group.children.forEach(function(m){if(!m.userData.strand)return;var pa=m.geometry.attributes.position,ix=m.geometry.index,K=c.R*6*4,n=ix.count;
      for(var q=K;q<n-K;q+=3){var tt=new Float64Array(9);for(var j=0;j<3;j++){var vi=ix.getX(q+j);tt[j*3]=pa.getX(vi);tt[j*3+1]=pa.getY(vi);tt[j*3+2]=pa.getZ(vi);}A.push(tt);}});

window.__anastasisCableWho=function(ev){var y0=root.position.y;root.position.y=0;Et=E=ev;applyScene(DUR);root.updateMatrixWorld(true);var out={};
  CABLES.forEach(function(c,ci){var A=[],seg=[];c.group.children.forEach(function(m){if(!m.userData.strand)return;var pa=m.geometry.attributes.position,ix=m.geometry.index,K=c.R*6*4,n=ix.count;
      for(var q=K;q<n-K;q+=3){var tt=new Float64Array(9);for(var j=0;j<3;j++){var vi=ix.getX(q+j);tt[j*3]=pa.getX(vi);tt[j*3+1]=pa.getY(vi);tt[j*3+2]=pa.getZ(vi);}A.push(tt);seg.push(Math.floor(q/(c.R*6)));}});
    var res={};root.children.forEach(function(ch,hi){if(ch===c.group||ch===glow||!ch.visible)return;var nm=CABLES.indexOf(CABLES.filter(function(x){return x.group===ch;})[0]);
      var label=nm>=0?'cable'+nm:ch===chassis?'chassis':ch===board.group?'board':ch===gpu.group?'gpu':ch===psu.group?'psu':'child'+hi;
      ch.traverseVisible(function(m){if(!m.isMesh)return;var S=_tris([m]);if(!S.length)return;var Gd=_grid(S,1.5),cnt=0,segs=[];
        A.forEach(function(a,ai){if(_hits([a],S,Gd,1.5)){cnt++;segs.push(seg[ai]);}});

window.__anastasisCross=function(){applyScene(DUR);return CABLES.map(function(c,ci){var out=[];for(var k=1;k<c.P.length;k++){if((c.P[k-1].z+0.25)*(c.P[k].z+0.25)<=0){var w=c.Wk[k];out.push('k'+k+' at('+c.P[k].x.toFixed(2)+','+c.P[k].y.toFixed(2)+') W('+w.x.toFixed(2)+','+w.y.toFixed(2)+','+w.z.toFixed(2)+')');}}return 'cable'+ci+': '+out.join(' | ');});};
/* validation gate: every cable triangle (full length + plug housings) vs every other visible mesh, classified.
   Intentional = contact in a cable's first/last 4 segments or its plug housing, against the part it plugs into. */
window.__anastasisState=function(ev){var y0=root.position.y;root.position.y=0;Et=E=ev;applyScene(DUR);root.updateMatrixWorld(true);var rear=chassis.userData.rear,cs=1.5;
  function ownerOf(ch,m){if(ch===chassis){var p=m;while(p&&p!==chassis){if(p===rear)return'rear';p=p.parent;}return'chassis';}
    for(var i=0;i<CABLES.length;i++)if(CABLES[i].group===ch)return'cable'+i;
    return ch===board.group?'board':ch===gpu.group?'gpu':ch===psu.group?'psu':ch===cpu?'cpu':ch===cooler.group?'cooler':ch===cfan.group?'coolerFan':ch===fanT.group?'fanTop':ch===fanB.group?'fanBottom':ch===shield?'shield':ch===ssd1?'ssd1':ch===ssd2?'ssd2':rams.indexOf(ch)>=0?'ram':'other';}
  var EXP=[['psu','board'],['psu','board'],['psu','gpu'],['chassis','board'],['chassis','board'],['chassis','board']],res=[];
  CABLES.forEach(function(c,ci){var stat=[],own=[];
    root.children.forEach(function(ch){if(ch===c.group||ch===glow||!ch.visible)return;ch.traverseVisible(function(m){if(!m.isMesh)return;var o=ownerOf(ch,m),T3=_tris([m]);for(var i=0;i<T3.length;i++){stat.push(T3[i]);own.push(o);}});});
    var G=_grid(stat,cs),K=4,tally={},at={};
    function test(tri,zone){var b=_bb(tri),seen={},hit={};
      for(var x=Math.floor(b[0]/cs);x<=Math.floor(b[3]/cs);x++)for(var y=Math.floor(b[1]/cs);y<=Math.floor(b[4]/cs);y++)for(var z=Math.floor(b[2]/cs);z<=Math.floor(b[5]/cs);z++){var L=G[x+','+y+','+z];if(!L)continue;
        for(var q=0;q<L.length;q++){var si=L[q];if(seen[si])continue;seen[si]=1;var s=stat[si],d=_bb(s);if(d[3]<b[0]||d[0]>b[3]||d[4]<b[1]||d[1]>b[4]||d[5]<b[2]||d[2]>b[5])continue;if(_triTri(tri,s))hit[own[si]]=1;}}
      for(var o in hit){var key=(((zone==='start'&&o===EXP[ci][0])||(zone==='end'&&o===EXP[ci][1]))?'I':'U')+':'+zone+':'+o;tally[key]=(tally[key]||0)+1;
        if(!at[key])at[key]=((tri[0]+tri[3]+tri[6])/3).toFixed(1)+','+((tri[1]+tri[4]+tri[7])/3).toFixed(1)+','+((tri[2]+tri[5]+tri[8])/3).toFixed(1);}}
    c.group.children.forEach(function(m){if(!m.visible)return;
      if(m.userData.strand){var pa=m.geometry.attributes.position,ix=m.geometry.index,per=c.R*6,n=ix.count;
        for(var q=0;q<n;q+=3){var t9=new Float64Array(9);for(var j=0;j<3;j++){var vi=ix.getX(q+j);t9[j*3]=pa.getX(vi);t9[j*3+1]=pa.getY(vi);t9[j*3+2]=pa.getZ(vi);}var sg=Math.floor(q/per);test(t9,sg<K?'start':sg>=c.S-K?'end':'mid');}}
      else{var zone=m===c.hStart?'start':'end';_tris([m]).forEach(function(t9){test(t9,zone);});}});
    var I=0,U=0;for(var k in tally){if(k[0]==='I')I+=tally[k];else U+=tally[k];}res.push({cable:ci,I:I,U:U,detail:tally,at:at});});
  Et=E=0;applyScene(t);root.position.y=y0;return res;};
