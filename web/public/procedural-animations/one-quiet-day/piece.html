<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>One Quiet Day</title>
<style>
:root{--bg:#000;--panel:rgba(18,17,15,.9);--ink:#ddd6c8;--line:rgba(255,255,255,.16);--accent:#c9a46a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--panel:rgba(18,17,15,.9);--ink:#ddd6c8;}}
:root[data-theme="dark"]{--bg:#000;--panel:rgba(18,17,15,.9);--ink:#ddd6c8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#view{display:block;background:#000;max-width:100%;}
#dev{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(420px,calc(100vw - 24px));
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;z-index:5}
#dev[hidden]{display:none}
#dev .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dev button,#dev select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
#dev button:focus-visible,#dev select:focus-visible,#dev input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#dev input[type=range]{width:100%;margin:8px 0 4px;accent-color:var(--accent)}
#dev .read{opacity:.8;margin-bottom:6px;font-variant-numeric:tabular-nums}
#dev .layers{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px}
#dev label{white-space:nowrap}
#snd{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.38);color:rgba(240,234,222,.92);
  opacity:0;transition:opacity .6s ease;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent}
#snd.show{opacity:.72}
#snd:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:2px}
#snd .w{display:none}#snd.on .w{display:inline}#snd.on .x{display:none}
@media (prefers-reduced-motion: reduce){#snd{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="view" role="img" aria-label="A meadow in the Blue Ridge foothills through one autumn day"></canvas></div>
<div id="dev" hidden></div>
<button id="snd" type="button" aria-label="Turn sound on"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5v5h3.6l4.9 4V5.5L7.6 9.5H4z" fill="currentColor"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="x" d="M15.6 9.6l4.8 4.8M20.4 9.6l-4.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
<script>
'use strict';
/* ---------- constants & math ---------- */
const W = 1920, H = 1080, HZ = 600, FL = 1500, EYE = 1.6, LOOP = 60;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const MOBILE = (() => { try { return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent); } catch (err) { return false; } })();
const GEN = MOBILE ? 0.55 : 1;   // lighter static generation on phones
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
const fract = x => x - Math.floor(x);
const mod = (a, n) => ((a % n) + n) % n;
const bump = (x, a, b, c, d) => sstep(a, b, x) * (1 - sstep(c, d, x)); // rise a..b, fall c..d

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Hash identical to GLSL hash12 (Dave Hoskins) */
function h12(x, y) {
  let a = fract(x * 0.1031), b = fract(y * 0.1031), c = fract(x * 0.1031);
  const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33);
  a += d; b += d; c += d;
  return fract((a + b) * c);
}
/* periodic value noise, matches shader pn() */
function pn2(x, y, per) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = mod(ix, per), x1 = mod(ix + 1, per), y0 = mod(iy, per), y1 = mod(iy + 1, per);
  const a = h12(x0, y0), b = h12(x1, y0), c = h12(x0, y1), d = h12(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm2(x, y, per, oct) {
  let s = 0, a = 0.5;
  for (let i = 0; i < oct; i++) {
    s += a * pn2(x + i * 7.31, y + i * 3.17, per);
    x *= 2; y *= 2; per *= 2; a *= 0.5;
  }
  return s;
}
function fbmM(x, y, per, oct, total) { // with mean fill for missing octaves
  let s = 0, a = 0.5;
  for (let i = 0; i < total; i++) {
    s += a * (i < oct ? pn2(x + i * 7.31, y + i * 3.17, per) : 0.5);
    x *= 2; y *= 2; per *= 2; a *= 0.5;
  }
  return s;
}
/* periodic 1D value noise (quintic) */
function pn1(x, per, salt = 7.3) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * f * (f * (f * 6 - 15) + 10);
  return lerp(h12(mod(i, per), salt), h12(mod(i + 1, per), salt), u);
}
/* plain (non periodic) smooth noise for static generation */
function sn2(x, y, seed = 0) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = h12(ix + seed * 131.7, iy), b = h12(ix + 1 + seed * 131.7, iy);
  const c = h12(ix + seed * 131.7, iy + 1), d = h12(ix + 1 + seed * 131.7, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function sfbm(x, y, oct, seed = 0) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * sn2(x, y, seed + i); n += a; x *= 2.03; y *= 2.03; a *= 0.5; }
  return s / n;
}
function sn1(x, seed = 0) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(h12(i, seed * 17.3 + 3.1), h12(i + 1, seed * 17.3 + 3.1), u);
}
function sfbm1(x, oct, seed = 0) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * sn1(x, seed + i * 3); n += a; x *= 2.1; a *= 0.5; }
  return s / n;
}

/* ---------- colour ---------- */
const cmul = (a, b) => [a[0] * b[0], a[1] * b[1], a[2] * b[2]];
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const csc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const cmix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clum = c => c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
const tmap = (c, E) => [1 - Math.exp(-c[0] * E), 1 - Math.exp(-c[1] * E), 1 - Math.exp(-c[2] * E)];
const to255 = v => (v <= 0 ? 0 : v >= 1 ? 255 : (v * 255 + 0.5) | 0);
function css(c, a) {
  if (a === undefined) return 'rgb(' + to255(c[0]) + ',' + to255(c[1]) + ',' + to255(c[2]) + ')';
  return 'rgba(' + to255(c[0]) + ',' + to255(c[1]) + ',' + to255(c[2]) + ',' + clamp(a).toFixed(3) + ')';
}

/* ---------- curves ---------- */
function crI(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
/* periodic 24h Catmull-Rom curve over [hour, value] keys */
function pcurve(keys) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  const n = keys.length, hs = keys.map(k => k[0]), vs = keys.map(k => k[1]);
  return h => {
    h = mod(h, 24);
    let i = n - 1;
    for (let k = 0; k < n; k++) if (hs[k] > h) { i = k - 1; break; }
    const i1 = mod(i, n), i2 = mod(i1 + 1, n), i0 = mod(i1 - 1, n), i3 = mod(i1 + 2, n);
    let h1 = hs[i1], h2 = hs[i2], hh = h;
    if (h2 <= h1) h2 += 24;
    if (hh < h1) hh += 24;
    const t = (hh - h1) / (h2 - h1);
    return crI(vs[i0], vs[i1], vs[i2], vs[i3], t);
  };
}
/* table over sun elevation, colour values, log-space interpolation */
function etable(els, cols) {
  const n = els.length, L = cols.map(c => c.map(v => Math.log(Math.max(v, 1e-5))));
  return e => {
    if (e <= els[0]) return cols[0].slice();
    if (e >= els[n - 1]) return cols[n - 1].slice();
    let i = 0;
    while (els[i + 1] < e) i++;
    const t = (e - els[i]) / (els[i + 1] - els[i]);
    const i0 = Math.max(i - 1, 0), i3 = Math.min(i + 2, n - 1);
    const out = [0, 0, 0];
    for (let j = 0; j < 3; j++) {
      // monotone-ish: Catmull-Rom in log space then clamp between neighbours
      let v = crI(L[i0][j], L[i][j], L[i + 1][j], L[i3][j], t);
      const lo = Math.min(L[i][j], L[i + 1][j]), hi = Math.max(L[i][j], L[i + 1][j]);
      v = clamp(v, lo, hi);
      out[j] = Math.exp(v);
      if (out[j] < 1.5e-5) out[j] = 0;
    }
    return out;
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}

/* ======================================================================
   ENVIRONMENT — continuous state functions of loop time
   ====================================================================== */
const H0 = 18.95;                 // opening clock hour (just after sunset)
const NOON = 13.0, LAT = 38.6 * DEG, SUN_DEC = -5.4 * DEG;
const MOON_DEC = -26 * DEG, MOON_TRANSIT = 19.33, MOON_RATE = 14.5;
const CAM_YAW = 240 * DEG;        // looking WSW toward the Blue Ridge
const CRV = [Math.sin(CAM_YAW + Math.PI / 2), Math.cos(CAM_YAW + Math.PI / 2)];
const CFV = [Math.sin(CAM_YAW), Math.cos(CAM_YAW)];
const CLOUD_H = 1.8, CELL = 3.0;  // km

/* ---- time warp: night passes faster, dusk/dawn linger ---- */
const WARP = (() => {
  const vm = (h, c, k) => Math.exp(k * (Math.cos(TAU * (h - c) / 24) - 1));
  const w = h => 1 - 0.5 * vm(h, 1.6, 2.2) + 0.55 * vm(h, 19.35, 30) + 0.45 * vm(h, 6.7, 30) + 0.12 * vm(h, 17.5, 20);
  const N = 6000, cum = new Float64Array(N + 1);
  for (let i = 0; i < N; i++) cum[i + 1] = cum[i] + w(H0 + 24 * (i + 0.5) / N) * 24 / N;
  const tot = cum[N];
  const M = 4096, tab = new Float64Array(M + 1);
  let j = 0;
  for (let k = 0; k <= M; k++) {
    const target = (k / M) * tot;
    while (j < N - 1 && cum[j + 1] < target) j++;
    const f = (target - cum[j]) / (cum[j + 1] - cum[j] || 1);
    tab[k] = H0 + 24 * (j + clamp(f)) / N;
  }
  tab[M] = H0 + 24;
  return { tab, M, w };
})();
function hourAtU(u) {
  u = mod(u, 1);
  const x = u * WARP.M, i = Math.floor(x), f = x - i;
  return mod(lerp(WARP.tab[i], WARP.tab[Math.min(i + 1, WARP.M)], f), 24);
}
function uAtHour(h) { // inverse (for scheduling); binary search
  let lo = 0, hi = 1;
  const target = mod(h - H0, 24);
  for (let k = 0; k < 40; k++) {
    const m = (lo + hi) / 2;
    if (mod(hourAtU(m) - H0, 24) < target) lo = m; else hi = m;
  }
  return (lo + hi) / 2;
}
const tAtHour = h => uAtHour(h) * LOOP;

/* ---- astronomy & camera ---- */
function astro(dec, Ha) {
  const sl = Math.sin(LAT), cl = Math.cos(LAT), sd = Math.sin(dec), cd = Math.cos(dec);
  const u = sl * sd + cl * cd * Math.cos(Ha);
  return { e: -cd * Math.sin(Ha), n: cl * sd - sl * cd * Math.cos(Ha), u, el: Math.asin(clamp(u, -1, 1)) };
}
const enuToCam = (e, n, u) => [e * CRV[0] + n * CRV[1], u, e * CFV[0] + n * CFV[1]];
const camToEnu = (x, y, z) => [x * CRV[0] + z * CFV[0], x * CRV[1] + z * CFV[1], y];
function camToScreen(v) { // direction or point in camera space
  if (v[2] <= 1e-4) return null;
  return { x: 960 + FL * v[0] / v[2], y: HZ - FL * v[1] / v[2] };
}
function screenToCam(x, y) {
  const a = (x - 960) / FL, b = (HZ - y) / FL, l = Math.hypot(a, b, 1);
  return [a / l, b / l, 1 / l];
}
/* world ground point (X right, Z forward, Y up; metres) -> screen */
const gy = Z => HZ + EYE * FL / Z;
const sx = (X, Z) => 960 + FL * X / Z;
const sy = (Y, Z) => HZ + FL * (EYE - Y) / Z;

/* ---- weather & activity curves (clock hours) ---- */
const COVER = pcurve([[0.5, .30], [2.5, .20], [4.0, .24], [5.5, .32], [7.0, .38], [8.5, .42], [10, .48], [11.5, .58],
  [12.6, .72], [13.3, .88], [14.0, .90], [14.6, .74], [15.3, .56], [16.2, .48], [17.2, .52], [18.2, .62], [18.95, .70],
  [20, .62], [21.5, .50], [23, .40]]);
const WIND = pcurve([[0, .18], [3, .15], [6, .09], [8, .22], [10, .36], [12, .45], [13.3, .78], [14.1, .62], [15, .50],
  [16.5, .44], [18, .36], [19, .30], [21, .22]]);
const HAZE = pcurve([[0, .25], [4, .32], [6.5, .55], [9, .38], [12, .42], [15, .55], [17, .58], [18.9, .48], [21, .32]]);
const RAIN = h => {
  const b = bump(h, 13.18, 13.5, 13.98, 14.35);
  return b * (0.75 + 0.25 * Math.sin((h - 13.2) * 9.0));
};
const WET = h => {
  let w = 0;
  if (h >= 13.2 && h < 14.2) w = sstep(13.2, 13.7, h);
  else if (h >= 14.2) w = Math.exp(-(h - 14.2) / 1.4);
  return clamp(Math.max(w, 0.45 * bump(h, 4.5, 6.3, 8.0, 9.6)));
};
const MIST = h => clamp(bump(h, 4.4, 6.0, 7.6, 9.4) + 0.16 * bump(mod(h - 12, 24), 9.2, 11.5, 16.4, 18.0));
const BIRDS = h => clamp(0.08 + 0.95 * bump(h, 5.6, 6.9, 7.9, 9.6) + 0.42 * bump(h, 8.5, 9.8, 15.8, 17.2) + 0.35 * bump(h, 17.0, 17.8, 18.6, 19.25)
  - 0.08 * bump(mod(h - 12, 24), 7.6, 8.4, 17.3, 17.6)) * (1 - 0.7 * bump(h, 13.2, 13.5, 14.0, 14.4));
const INSECTS = h => clamp(0.15 + 0.85 * bump(mod(h - 12, 24), 6.6, 8.0, 14.0, 17.5) + 0.12 * bump(h, 13.8, 15.0, 17.0, 18.6)) * (1 - 0.8 * bump(h, 13.2, 13.5, 14.0, 14.5));

/* ---- sky radiance tables (indexed by sun elevation, degrees) ---- */
const SKY_EL = [-20, -12, -8, -5, -3, -1, 1, 4, 10, 25, 50];
const ZEN_T = etable(SKY_EL, [[.0004, .0006, .0012], [.0015, .0025, .0055], [.008, .014, .032], [.03, .05, .10], [.07, .11, .21], [.14, .21, .38], [.22, .32, .55], [.30, .45, .75], [.38, .56, .90], [.42, .62, 1.0], [.45, .66, 1.05]]);
const HORA_T = etable(SKY_EL, [[.0007, .0009, .0015], [.002, .0028, .005], [.010, .013, .024], [.035, .045, .075], [.08, .09, .13], [.16, .16, .22], [.30, .30, .36], [.50, .52, .58], [.70, .76, .86], [.85, .92, 1.02], [.9, .97, 1.08]]);
const HORS_T = etable(SKY_EL, [[.0007, .0009, .0015], [.004, .004, .006], [.03, .022, .025], [.14, .075, .05], [.32, .16, .07], [.62, .32, .12], [.95, .55, .25], [1.15, .80, .45], [1.15, 1.0, .80], [1.05, 1.05, 1.02], [1.0, 1.03, 1.05]]);
const BELT_T = etable(SKY_EL, [[0, 0, 0], [0, 0, 0], [0, 0, 0], [.02, .012, .015], [.06, .035, .04], [.10, .06, .06], [.10, .07, .06], [.04, .03, .02], [0, 0, 0], [0, 0, 0], [0, 0, 0]]);
const GLOW_T = etable(SKY_EL, [[0, 0, 0], [.002, .001, .0015], [.02, .008, .008], [.10, .04, .02], [.22, .09, .03], [.40, .18, .06], [.42, .24, .10], [.28, .18, .09], [.12, .09, .06], [.04, .03, .02], [0, 0, 0]]);

function sunTrans(elDeg, haze) {
  const e = Math.max(elDeg, 0.15);
  const m = 1 / (Math.sin(e * DEG) + 0.50572 * Math.pow(e + 6.07995, -1.6364));
  const k = 1 + haze * 0.9;
  return [Math.exp(-m * 0.05 * k) * 0.95, Math.exp(-m * 0.10 * k), Math.exp(-m * 0.22 * k) * 1.12];
}

/* JS replica of shader skyRad (radiance) */
function skyRadJS(d, e) {
  const el = Math.max(d[1], 0);
  let hx = d[0], hz = d[2], hl = Math.hypot(hx, hz) || 1; hx /= hl; hz /= hl;
  let sxx = e.sunCam[0], szz = e.sunCam[2], sl = Math.hypot(sxx, szz) || 1; sxx /= sl; szz /= sl;
  const ca = hx * sxx + hz * szz;
  const sw = Math.pow(0.5 + 0.5 * ca, 2);
  const hor = cmix(e.horA, e.horS, sw);
  const t = 1 - Math.exp(-el * 6);
  let c = cmix(hor, e.zen, t);
  c = cadd(c, csc(e.glow, Math.pow(0.5 + 0.5 * ca, 5) * Math.exp(-el * 9)));
  c = cadd(c, csc(e.belt, Math.pow(0.5 - 0.5 * ca, 1.5) * Math.exp(-Math.pow((el - 0.08) / 0.06, 2))));
  const cs = clamp(d[0] * e.sunCam[0] + d[1] * e.sunCam[1] + d[2] * e.sunCam[2], -1, 1);
  const ang = Math.acos(cs);
  c = cadd(c, csc(e.aur, Math.exp(-ang / 0.045) * 0.9 + Math.exp(-ang / 0.22) * 0.35));
  return c;
}

/* JS replica of the cloud density field (cells, camera-aligned plane) */
function cloudD(x, z, u, cover, soft, oct) {
  const q1x = x + 10 * u, q1z = z + 10 * u;
  const wx = pn2(q1x * 0.5 + 3.1, q1z * 0.5 + 3.1, 5) - 0.5;
  const wz = pn2(q1x * 0.5 + 11.7, q1z * 0.5 + 11.7, 5) - 0.5;
  const n1 = fbmM(q1x + wx * 1.2, q1z + wz * 1.2, 10, oct, 6);
  const n2 = fbmM(x * 1.6 - 10 * u, z * 1.6 + 20 * u, 10, oct, 6);
  const n = n1 * 0.65 + n2 * 0.35;
  const thr = lerp(0.70, 0.30, cover);
  return sstep(thr, thr + soft, n);
}
/* density along a direction from a ground point (camera-space metres) */
function cloudAlong(px, pz, dir, e, oct = 4) {
  if (dir[1] < 0.035) return clamp(e.cover * 0.85 + e.strat * 0.5);
  const tk = Math.min(CLOUD_H / dir[1], 60); // km

let ridgeElAt = x => 0.8; // replaced by world module (degrees)

function computeEnv(tSec) {
  const e = {};
  e.t = mod(tSec, LOOP); e.u = e.t / LOOP;
  const h = e.hour = hourAtU(e.u);
  // sun & moon
  const s = astro(SUN_DEC, (h - NOON) * 15 * DEG);
  e.sunEl = s.el / DEG; e.sunCam = enuToCam(s.e, s.n, s.u);
  let mh = mod(h - MOON_TRANSIT + 12, 24) - 12;
  const m = astro(MOON_DEC, mh * MOON_RATE * DEG);
  e.moonEl = m.el / DEG; e.moonCam = enuToCam(m.e, m.n, m.u);
  e.moonIllum = (1 - (s.e * m.e + s.n * m.n + s.u * m.u)) / 2;
  e.lst = mod(19.89 + (h - 20), 24) * 15 * DEG;
  // weather
  e.cover = clamp(COVER(h));
  e.rain = clamp(RAIN(h)); e.wet = WET(h); e.mist = MIST(h);
  e.haze = clamp(HAZE(h) + 0.25 * e.rain);
  e.soft = 0.12 + 0.10 * e.cover;
  e.strat = clamp(sstep(0.70, 0.92, e.cover) * 0.75 + e.rain * 0.35);
  e.dark = clamp(0.22 + 0.9 * sstep(0.55, 0.92, e.cover) * 0.6 + e.rain * 0.35);
  e.birds = BIRDS(h); e.insects = INSECTS(h);
  // wind: base * periodic gusts (period divides loop)
  e.windBase = clamp(WIND(h));
  e.gust = pn1(e.u * 30, 30, 1.7);
  e.wind = e.windBase * (0.6 + 0.8 * e.gust);

  // sky colours
  const el = e.sunEl;
  let zen = ZEN_T(el), horA = HORA_T(el), horS = HORS_T(el), belt = BELT_T(el), glow = GLOW_T(el);
  const moonUp = sstep(-1, 6, e.moonEl);
  e.moonUp = moonUp;
  const msky = 0.0018 * Math.pow(e.moonIllum, 1.3) * Math.max(Math.sin(e.moonEl * DEG), 0) * sstep(-4, -12, el);
  zen = cadd(zen, csc([0.55, 0.72, 1.0], msky)); horA = cadd(horA, csc([0.7, 0.8, 1.0], msky * 1.3)); horS = cadd(horS, csc([0.7, 0.8, 1.0], msky * 1.3));
  // haze lightens & desaturates horizon
  const hzF = e.haze * 0.35;
  horA = cmix(horA, csc([1.02, 1.0, 0.97], clum(horA) * 1.08), hzF);
  horS = cmix(horS, csc([1.04, 1.0, 0.94], clum(horS) * 1.05), hzF * 0.7);
  // rain / overcast darken & grey
  const dk = 1 - 0.45 * e.rain - 0.18 * e.strat;
  const grey = clamp(e.rain * 0.8 + e.strat * 0.4);
  const deSat = c => cmix(c, csc([1, 1, 1.02], clum(c)), grey);
  e.zen = csc(deSat(zen), dk); e.horA = csc(deSat(horA), dk); e.horS = csc(deSat(horS), dk);
  e.belt = csc(belt, 1 - e.strat); e.glow = csc(glow, (1 - 0.6 * e.strat) * (1 - 0.6 * e.rain));

  const T = sunTrans(el, e.haze);
  e.sunT = T;
  e.aur = csc(T, 0.55 * sstep(-2.5, 1.5, el) * (1 - 0.5 * e.strat));
  e.sunDisc = csc(T, 38 * sstep(-0.6, 0.4, el));
  // light reaching clouds (stays lit a little after ground sunset)
  const Tc = sunTrans(el + 2.6, e.haze * 0.6);
  e.cSun = csc(Tc, 1.55 * sstep(-6.5, -0.8, el) * (1 - 0.45 * e.rain));
  e.cAmb = csc(cadd(cmix(e.zen, e.horA, 0.55), [0.0002, 0.00025, 0.0004]), 0.9);
  // moon light on clouds at night
  const Tm = sunTrans(Math.max(e.moonEl, 0.2), e.haze);
  e.moonIrr = csc(cmul(Tm, [0.82, 0.88, 1.0]), 0.0058 * Math.pow(e.moonIllum, 1.2) * sstep(0, 7, e.moonEl));

  e.cSun = cadd(e.cSun, csc(e.moonIrr, 1.6 * nightW));
  e.lightDir = (() => {
    const w = sstep(-8, -3, el), a = e.sunCam, b = e.moonCam;
    const v = [lerp(b[0], a[0], w), lerp(b[1], a[1], w), lerp(b[2], a[2], w)];
    const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l];
  })();
  e.moonCol = csc(cmul(Tm, [1.0, 0.97, 0.9]), 0.065 * sstep(-1.0, 0.6, e.moonEl));
  e.moonGlow = 0.0018 * e.moonIllum * moonUp * (0.6 + e.haze);

  // stars & milky way
  e.star = sstep(-7, -13.5, el) * (1 - 0.5 * moonUp * e.moonIllum) * (1 - 0.6 * e.haze * 0.5);
  e.mw = sstep(-14, -18, el) * (1 - 0.92 * moonUp * e.moonIllum) * (1 - 0.4 * e.haze);

  // sun visibility for the land: ridge + clouds
  const sp = camToScreen(e.sunCam);
  let rEl = 0.9;
  if (sp && sp.x > -200 && sp.x < 2120) rEl = ridgeElAt(clamp(sp.x, 0, 1919));
  e.sunScreen = sp;
  e.sunVisLand = sstep(rEl - 0.3, rEl + 0.35, el);
  const dens = cloudAlong(0, 0, e.sunCam, e);
  e.sunCloud = 1 - clamp(0.93 * dens);
  e.sunIrrClear = csc(T, 1.25 * e.sunVisLand * (1 - 0.35 * e.strat));
  e.sunIrr = csc(e.sunIrrClear, e.sunCloud);
  const mdens = cloudAlong(0, 0, e.moonCam, e);
  e.moonCloud = 1 - clamp(0.9 * mdens);

  // ambient sky light
  let amb = csc(cadd(csc(e.zen, 0.5), csc(e.horA, 0.5)), 0.72);
  amb = csc(amb, (1 + 0.28 * e.cover) * (1 - 0.35 * e.rain));
  amb = cadd(amb, [0.00034, 0.00042, 0.0007]);
  amb = cadd(amb, csc(e.moonIrr, 0.3 * e.moonCloud));
  e.amb = amb;
  const avgSun = csc(e.sunIrrClear, 0.75 * (1 - 0.62 * e.cover));
  const lumL = clum(cadd(cadd(amb, avgSun), csc(e.moonIrr, 0.8)));
  e.E = 1.6 / (Math.pow(lumL, 0.55) + 0.0005);

  // land lighting (display space): Ldisp(cs) = tmap(Lamb + Lsun*cs, E)
  e.Lamb = cadd(amb, csc(e.moonIrr, 0.85 * e.moonCloud));
  e.Lsun = csc(e.sunIrrClear, 0.75);
  e.landLight = cs => tmap(cadd(e.Lamb, csc(e.Lsun, cs)), e.E);
  e.shadowRatio = (() => { // per-channel ratio of shadowed to lit light
    const a = tmap(e.Lamb, e.E), b = tmap(cadd(e.Lamb, e.Lsun), e.E);
    return [a[0] / Math.max(b[0], 1e-4), a[1] / Math.max(b[1], 1e-4), a[2] / Math.max(b[2], 1e-4)];
  })();
  e.sunStrength = clamp(clum(tmap(e.Lsun, e.E)) / Math.max(clum(e.landLight(1)), 1e-3)); // 0..1 share of direct light
  // fog colours along the horizon (display)
  const fd = x => tmap(skyRadJS(screenToCam(x, HZ - 6), e), e.E);
  e.fogL = fd(0); e.fogC = fd(960); e.fogR = fd(1920);
  e.fogHi = tmap(skyRadJS(screenToCam(960, HZ - 120), e), e.E);
  // screen-space light direction helpers
  e.sunFront = e.sunCam[2];               // >0: sun ahead (back-lit scene)
  const sdl = Math.hypot(e.sunCam[0], e.sunCam[1]) || 1;
  e.sun2d = [e.sunCam[0] / sdl, -e.sunCam[1] / sdl];
  e.lightsOn = sstep(-1.5, -5, el);       // vehicle headlights / house lights
  e.night = sstep(-4, -12, el);
  return e;
}

const SKY_VS = `attribute vec2 aP; void main(){ gl_Position = vec4(aP,0.,1.); }`;
const SKY_FS = `
precision highp float;
uniform vec2 uRes; uniform float uPix;
uniform vec3 uSun, uMoon, uLDir;
uniform vec3 uZen, uHorA, uHorS, uBelt, uGlow, uAur, uSunDisc, uCSun, uCAmb, uMoonCol;
uniform float uCover, uSoft, uDark, uStrat, uU, uE, uStar, uMW, uLst, uLat, uMoonGlow, uT, uHaze, uRain, uSunElD, uMaxF;
uniform vec4 uCam;

float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

}
float fbm(vec2 q, float per, float fp){
  float s=0., a=.5, f=1.;

    float fi=float(i);
    float w=clamp(1.25-fp*f*1.7,0.,1.)*step(f,uMaxF);
    float nv=.5; if(w>0.) nv=pn(q+vec2(fi*7.31,fi*3.17),per);

  }

}
float cloudN(vec2 p, float fp){
  vec2 q1 = p + vec2(10.)*uU;

  float n1 = fbm(q1 + w*1.2, 10., fp);

float cloudD(vec2 p, float fp){

}
vec3 skyRad(vec3 d){
  float el = max(d.y, 0.0);

  float ca = dot(hd, sd);
  float sw = pow(0.5+0.5*ca, 2.0);

vec3 toEq(vec3 d){

vec3 starLayer(vec3 eq, float sc, float dens, float bmul, float salt){

/* ======================================================================
   WORLD — deterministic static scene + per-frame drawing of static parts
   Coordinates: X metres right, Z metres forward, Y metres up. Eye 1.6 m.
   ====================================================================== */
const World = {};
const RIDGE_D = [14, 8, 3.5];
const POND = { x: -3.5, z: 31, a: 7.0, b: 4.2 };
const SPOT_A = [2.5, 12.0], SPOT_B = [-5.0, 16.6];
const ROCK = [-6.6, 17.35];
const TRAIL = [[14, 13.8], [9, 14.4], [5.5, 13.0], [2.5, 12.0], [0.5, 13.3], [-1.4, 15.0], [-3.2, 16.0], [-5.0, 16.6], [-9, 16.6], [-17, 17.2]];

function inPond(X, Z, m = 0) {
  const dx = (X - POND.x) / (POND.a - m), dz = (Z - POND.z) / (POND.b - m);
  return dx * dx + dz * dz < 1;
}
function pondDist(X, Z) {
  const q = Math.hypot((X - POND.x) / POND.a, (Z - POND.z) / POND.b);
  return (q - 1) * Math.min(POND.a, POND.b);

}

}
function grassH(X, Z) {

/* ---------- road geometry ---------- */
function buildRoad() {
  const pts = [];
  const P = ROAD_PTS;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(i - 1, 0)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(i + 2, P.length - 1)];
    for (let k = 0; k < 24; k++) {
      const t = k / 24;
      pts.push([crI(p0[0], p1[0], p2[0], p3[0], t), crI(p0[1], p1[1], p2[1], p3[1], t)]);
    }
  }
  pts.push(P[P.length - 1].slice());
  const s = [0];
  for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = s[s.length - 1];
  const at = d => { // point & tangent at arc length d
    d = clamp(d, 0, len - 0.01);
    let lo = 0, hi = s.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (s[m] <= d) lo = m; else hi = m; }
    const f = (d - s[lo]) / (s[lo + 1] - s[lo]);
    const a = pts[lo], b = pts[lo + 1];
    const tx = b[0] - a[0], tz = b[1] - a[1], tl = Math.hypot(tx, tz);
    return { X: lerp(a[0], b[0], f), Z: lerp(a[1], b[1], f), tx: tx / tl, tz: tz / tl };

/* ---------- sprite generators ---------- */
function leafSprite(rpx, palette, seed, dark) {
  const R = rng(seed);

  const cx = s / 2, cy = s / 2, nb = 4 + Math.floor(R() * 4);
  const blobs = Array.from({ length: nb }, () => { const a = R() * TAU, d = Math.sqrt(R()) * rpx * 0.55; return [cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.85, rpx * (0.34 + R() * 0.3)]; });

function brushSprite(kind, wpx, hpx, seed) {
  const R = rng(seed);

  const c = makeCanvas(cw, ch), g = c.getContext('2d');

    sumac: [[0.74, 0.15, 0.08], [0.82, 0.30, 0.08], [0.60, 0.10, 0.07], [0.86, 0.46, 0.12], [0.50, 0.12, 0.08]],

  };

    g.fillStyle = css(csc(pal[Math.floor(R() * pal.length)], sh * (0.85 + R() * 0.3)));

    const N = Math.floor(wpx * hpx * 0.55);

/* ---------- trees ---------- */
function genTree(kind, X, Z, seed) {
  const R = rng(seed), k = FL / Z;
  const oak = kind === 'oak';
  const P = oak
    ? { trunkH: 3.3, trunkW: 0.95, limbs: [-64, -30, 6, 38, 66], len: [6.0, 6.6, 6.2, 6.4, 5.4], depth: 4, spread: 30, decay: 0.72, env: [0.3, 10.8, 8.6, 6.0], crR: [1.0, 1.55] }

    const x1 = x + Math.sin(ang) * len, y1 = y + Math.cos(ang) * len;
    segs.push({ x0: x, y0: y, x1, y1, w0: w, w1: w * 0.7, lvl, ph });

      a = lerp(a, 0, oak ? 0.08 : 0.16);
      branch(x1, y1, a, len * (P.decay + R() * 0.1), w * 0.62, lvl + 1, ph + (R() - 0.5) * 1.2);
    }
    if (lvl >= 2 && R() < 0.6) cl.push({ x: lerp(x, x1, 0.6), y: lerp(y, y1, 0.6), r: lerp(P.crR[0], P.crR[1], R()) * 0.85, lvl, ph });
  };

  P.limbs.forEach((a, i) => branch(0.08, P.trunkH, a * DEG + (R() - 0.5) * 0.1, P.len[i] * 0.55, P.trunkW * 0.55, 1, R() * TAU));
  const [ecx, ecy, erx, ery] = P.env;
  const inEnv = (x, y, s) => Math.pow((x - ecx) / (erx * s), 2) + Math.pow((y - ecy) / (ery * s), 2) < 1;
  let clusters = cl.filter(c => inEnv(c.x, c.y, 1.12));

  for (let i = 0; i < (oak ? 62 : 46); i++) {
    const a = R() * TAU, rr = Math.sqrt(R()) * 0.92;
    const x = ecx + Math.cos(a) * erx * rr, y = ecy + Math.sin(a) * ery * rr;

    clusters.push({ x, y, r: lerp(P.crR[0], P.crR[1], R()) * 0.95, lvl: best.lvl + 1, ph: best.ph });
  }
  const pal = oak
    ? [[0.42, 0.36, 0.16], [0.52, 0.32, 0.15], [0.36, 0.30, 0.14], [0.58, 0.46, 0.22], [0.30, 0.32, 0.15], [0.46, 0.25, 0.12], [0.50, 0.40, 0.18]]
    : [[0.80, 0.30, 0.10], [0.70, 0.17, 0.08], [0.86, 0.48, 0.12], [0.82, 0.62, 0.18], [0.56, 0.14, 0.08], [0.46, 0.40, 0.15], [0.84, 0.38, 0.10]];

}

/* ---------- build everything ---------- */
function buildWorld() {
  const Wd = World;

    mk(x => 557 - 86 * sfbm1(x / 620 + 3.3, 5, 11) - 28 * Math.exp(-Math.pow((x - 1330) / 190, 2)) + 10 * Math.exp(-Math.pow((x - 640) / 85, 2))),
    mk(x => 585 - 56 * sfbm1(x / 430 + 1.7, 5, 23) + 58 * sstep(880, 1250, x)),
    mk(x => 601 - 28 * sfbm1(x / 270 + 5.1, 4, 37) - 7 * sfbm1(x / 60, 3, 41)),

    [[0.56, 0.32, 0.12], [0.62, 0.48, 0.16], [0.46, 0.21, 0.10], [0.31, 0.30, 0.14], [0.38, 0.26, 0.14], [0.17, 0.21, 0.13], [0.52, 0.40, 0.18]],
  ];

    const p = new Path2D(); p.moveTo(-4, 690); p.lineTo(-4, a[0]);
    for (let i = 0; i < NX; i++) p.lineTo(i * 4, a[i]);
    p.lineTo(1924, a[NX - 1]); p.lineTo(1924, 690); p.closePath();

      gr.addColorStop(0, 'rgba(255,255,255,0.10)'); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.25)');
      g.fillStyle = gr; g.fillRect(0, top, W, 690 - top);
    } else {

      const y0 = top, hh = 690 - top;
      const img = g.createImageData(W, hh), d = img.data;
      const fpal = [[0.36, 0.42, 0.20], [0.55, 0.48, 0.27], [0.66, 0.58, 0.36], [0.42, 0.32, 0.21], [0.30, 0.42, 0.18], [0.48, 0.44, 0.24], [0.60, 0.52, 0.30]];
      for (let yy = 0; yy < hh; yy++) {

function genGrass() {
  const R = rng(4242);

    const tr = trailDist(X, Z);

}

function buildLightmap(e, t, vs) {

  const sunOn = e.Lsun[0] + e.Lsun[1] > 0.003 && App.layers.clouds;
  for (let j = 0; j < gh; j++) {
    const y = (j + 0.5) * H / gh, ground = y > 612;
    const Z = ground ? clamp(2400 / (y - 600), 4, 140) : 62;
    for (let i = 0; i < gw; i++) {
      const X = ((i + 0.5) * W / gw - 960) * Z / FL;
      const cs = sunOn ? 1 - 0.85 * cloudAlong(X, Z, e.sunCam, e, 3) : 1;
      let L = tmap(cadd(e.Lamb, csc(e.Lsun, cs)), e.E);

      const k = (j * gw + i) * 4; d[k] = to255(L[0]); d[k + 1] = to255(L[1]); d[k + 2] = to255(L[2]); d[k + 3] = 255;

    const sc = css(cmix([1, 1, 1], e.shadowRatio, clamp(e.sunCloud * 1.05)));
    for (const T of World.trees) {
      const sp = treeShadowPoly(T, e); if (!sp) continue;

      lmctx.beginPath(); sp.pts.forEach((q, i) => i ? lmctx.lineTo(q[0], q[1]) : lmctx.moveTo(q[0], q[1])); lmctx.closePath(); lmctx.fill();
      lmctx.beginPath(); sp.trunk.forEach((q, i) => i ? lmctx.lineTo(q[0], q[1]) : lmctx.moveTo(q[0], q[1])); lmctx.closePath(); lmctx.fill();
    }

  }
  for (const m of emis) {
    if (m.a < 0.005) continue;
    const g = mctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, css(m.c, m.a)); g.addColorStop(0.22, css(m.c, m.a * 0.32)); g.addColorStop(1, css(m.c, 0));
    mctx.fillStyle = g; mctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    if (m.core) { mctx.fillStyle = css(cmix(m.c, [1, 1, 1], 0.5), m.a); mctx.fillRect(m.x - m.core / 2, m.y - m.core / 2, m.core, m.core); }
  }
  // sun bloom wrapping the ridge / trees
  const sp = e.sunScreen;
  if (sp && e.sunEl > -1.2 && sp.x > -400 && sp.x < 2320 && sp.y > -400) {
    const rEl = ridgeElAt(clamp(sp.x, 0, 1919));
    const vis = e.sunCloud * sstep(rEl - 1.4, rEl + 0.3, e.sunEl) * (1 - 0.5 * e.strat);
    const a = vis * 0.42 * (1 - 0.4 * sstep(10, 30, e.sunEl));
    if (a > 0.01) {
      const c = tmap(csc(e.sunT, 1.4), 1.2);
      const g = mctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, 300);
      g.addColorStop(0, css(c, a)); g.addColorStop(0.12, css(c, a * 0.35)); g.addColorStop(1, css(c, 0));
      mctx.fillStyle = g; mctx.fillRect(sp.x - 300, sp.y - 300, 600, 600);
    }
  }
  mctx.globalCompositeOperation = 'source-over';
  // mist bands
  if (Lr.weather && e.mist > 0.01) {
    const mc = cmix(e.fogC, tmap(cadd(csc(e.Lamb, 1.25), csc(e.Lsun, 0.6)), e.E), 0.6);
    for (let v = 0; v < 2; v++) { const tg = mistTint[v].getContext('2d'); tg.globalCompositeOperation = 'copy'; tg.drawImage(mistTex[v], 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = css(mc); tg.fillRect(0, 0, W, 64); }
    for (const [y, h, w, K, v] of [[605, 44, 0.55, 1, 0], [636, 74, 0.32, 2, 1], [680, 52, 0.48, 1, 0], [780, 220, 0.12, 3, 1]]) {
      mctx.globalAlpha = clamp(e.mist * w);
      const off = mod(-e.u * K * W, W);
      mctx.drawImage(mistTint[v], off - W, y - h / 2, W, h); mctx.drawImage(mistTint[v], off, y - h / 2, W, h);
    }
    mctx.globalAlpha = 1;
  }
  // rain
  if (Lr.weather && e.rain > 0.01) {
    const n = Math.floor(460 * e.rain);
    mctx.strokeStyle = css(cmix(e.fogC, [1, 1, 1], 0.25), 0.13 + 0.08 * e.rain); mctx.lineWidth = 1;
    mctx.beginPath();
    for (let i = 0; i < n; i++) {
      const r1 = h12(i, 1.3), r2 = h12(i, 7.7), r3 = h12(i, 3.1);
      const v = 1300 + 500 * r3, len = 14 + 24 * r3;
      const y = mod(r2 * 1300 + t * v, 1300) - 120, x = r1 * 2240 - 160 - 0.2 * (y + 120);
      mctx.moveTo(x, y); mctx.lineTo(x - 0.2 * len, y + len);
    }
    mctx.stroke();
  }
  if (Lr.post) {
    if (App.grain) {
      const fi = Math.floor(t * 24);
      mctx.save(); mctx.globalCompositeOperation = 'overlay'; mctx.globalAlpha = 0.07;
      mctx.translate(-h12(fi, 1) * 160, -h12(fi, 2) * 160); mctx.fillStyle = grainPats[fi % 3]; mctx.fillRect(0, 0, W + 320, H + 320);
      mctx.restore();
    }
    const vg = mctx.createRadialGradient(960, 560, 520, 960, 560, 1250);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
    mctx.fillStyle = vg; mctx.fillRect(0, 0, W, H);
  }
}

function renderFrame(t) {
  const e = computeEnv(t);
  e.fogK = 0.0011 + e.mist * 0.0072 + e.rain * 0.004 + e.haze * 0.0006;
  e.csMid = e.Lsun[0] > 0.002 ? 1 - 0.85 * cloudAlong(0, 100, e.sunCam, e, 3) : 1;
  const S = mainC.width / W, Lr = App.layers, mot = App.mot;
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalAlpha = 1; mctx.globalCompositeOperation = 'source-over';
  if (Lr.sky && Sky.ok) { Sky.render(e, t, Lr); mctx.drawImage(Sky.canvas, 0, 0, mainC.width, mainC.height); }
  else { mctx.setTransform(S, 0, 0, S, 0, 0); if (Lr.sky) Sky.fallback(mctx, e, t); else { mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H); } }
  mctx.setTransform(S, 0, 0, S, 0, 0);
  const fg = mctx.createLinearGradient(0, 0, W, 0);
  fg.addColorStop(0, css(e.fogL)); fg.addColorStop(0.5, css(e.fogC)); fg.addColorStop(1, css(e.fogR));
  const emis = [], vs = Lr.vehicles ? vehicleStates(t) : [];
  if (Lr.terrain) { drawRidges(mctx, e, fg); drawFarm(mctx, e); drawPolesAndWires(mctx, e); if (Lr.wildlife) drawWireBirds(mctx, e, t); drawRoad(mctx, e); }
  for (const s of vs) drawVehicle(mctx, s, e, emis);
  if (Lr.terrain) drawTreeLine(mctx, e);
  if (Lr.near) {
    drawPond(mctx, mainC, S, e, t, mot, pondTmp);
    mctx.setTransform(S, 0, 0, S, 0, 0);
    buildLightmap(e, t, vs);
    renderNear(e, t, mot, S);
  }
  renderPost(e, t, mot, S, emis, vs);
  App.env = e; App.vs = vs;
  return e;
}

/* ---------- developer panel & keys ---------- */
function buildDev() {
  const d = document.getElementById('dev');
  d.innerHTML = '<div class="row"><button id="dPlay" type="button">Pause</button><button id="dRestart" type="button">Restart</button>' +
    '<label>Speed <select id="dSpeed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label></div>' +
    '<input id="dScrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline">' +
    '<div class="read" id="dRead"></div><div class="layers">' +
    Object.keys(App.layers).map(k => '<label><input type="checkbox" data-l="' + k + '" checked> ' + k + '</label>').join('') +
    '<label><input type="checkbox" id="dGrain" checked> grain</label><label><input type="checkbox" id="dSound"> sound</label></div>';
  const play = document.getElementById('dPlay');
  play.onclick = () => { App.playing = !App.playing; };
  document.getElementById('dRestart').onclick = () => { App.t = 0; };
  document.getElementById('dSpeed').onchange = ev => { App.speed = parseFloat(ev.target.value); };
  const sc = document.getElementById('dScrub');
  sc.oninput = () => { App.t = parseFloat(sc.value); App.scrubbing = true; };
  sc.onchange = () => { App.scrubbing = false; };
  d.querySelectorAll('input[data-l]').forEach(cb => cb.onchange = () => { App.layers[cb.dataset.l] = cb.checked; });
  document.getElementById('dGrain').onchange = ev => { App.grain = ev.target.checked; };
  document.getElementById('dSound').onchange = ev => { if (ev.target.checked !== Snd.on) App.toggleSound(); };
}
function updateDev() {
  const d = document.getElementById('dev'); if (d.hidden) return;
  document.getElementById('dPlay').textContent = App.playing ? 'Pause' : 'Play';
  const sc = document.getElementById('dScrub'); if (!App.scrubbing) sc.value = App.t.toFixed(2);
  const e = App.env; if (!e) return;
  const hh = Math.floor(e.hour), mm = Math.floor((e.hour - hh) * 60);
  document.getElementById('dRead').textContent = 't ' + App.t.toFixed(2) + 's · ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') +
    ' · sun ' + e.sunEl.toFixed(1) + '° · ' + (App.fps || 0).toFixed(0) + ' fps · q' + App.q + (Sky.ok ? '' : ' · 2D sky');
}
function onKey(ev) {
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) { if (ev.code !== 'KeyD') return; }
  if (ev.code === 'KeyD') { const d = document.getElementById('dev'); d.hidden = !d.hidden; ev.preventDefault(); }
  else if (ev.code === 'Space') { App.playing = !App.playing; ev.preventDefault(); }
  else if (ev.code === 'KeyR') { App.t = 0; }
  else if (ev.code === 'KeyM') { App.toggleSound(); }
}

/* ---------- loop with adaptive quality ---------- */
let lastNow = 0, emaCost = 12, emaInt = 16.7, slowAcc = 0, fastAcc = 0;
function tick(now) {
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
  lastNow = now;
  if (App.playing && !App.scrubbing) App.t = mod(App.t + dt * App.speed, LOOP);
  const t0 = performance.now();
  try { renderFrame(App.t); } catch (err) { console.error(err); }
  try { Snd.update(App.env, App.t, App.playing && !App.scrubbing, App.playing ? App.vs : [], App.dog); } catch (err) { console.error(err); }
  const cost = performance.now() - t0;
  emaCost = emaCost * 0.9 + cost * 0.1; if (dt) emaInt = emaInt * 0.9 + dt * 1000 * 0.1;
  App.fps = 1000 / emaInt;
  if (emaInt > 27 || emaCost > 24) { slowAcc += dt; fastAcc = 0; } else if (emaInt < 18 && emaCost < 9) { fastAcc += dt; slowAcc = 0; } else { slowAcc = 0; fastAcc = 0; }
  if (slowAcc > 1.5 && App.q < QS.length - 1) { App.q++; resize(); slowAcc = 0; }
  if (fastAcc > 6 && App.q > 0) { App.q--; resize(); fastAcc = 0; }
  updateDev();
  requestAnimationFrame(tick);
}
function setupSound() {
  const b = document.getElementById('snd');
  let timer = 0;
  const show = ms => { b.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => { if (document.activeElement !== b) b.classList.remove('show'); }, ms); };
  const sync = () => { b.setAttribute('aria-label', Snd.on ? 'Turn sound off' : 'Turn sound on'); b.classList.toggle('on', Snd.on); const cb = document.getElementById('dSound'); if (cb) cb.checked = Snd.on; };
  App.toggleSound = () => { try { if (Snd.on) Snd.stop(); else Snd.start(); } catch (err) { console.error(err); } sync(); };
  b.addEventListener('click', ev => { ev.stopPropagation(); App.toggleSound(); show(2500); });
  window.addEventListener('pointermove', () => show(2500), { passive: true });
  window.addEventListener('pointerdown', () => show(3000), { passive: true });
  b.addEventListener('focus', () => b.classList.add('show'));
  b.addEventListener('blur', () => show(1200));
  document.addEventListener('visibilitychange', () => { if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume(); });
  show(5000); sync();
}
function boot() {
  initCanvases();
  resize();
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.fillStyle = '#000'; mctx.fillRect(0, 0, mainC.width, mainC.height);
  setupSound();
  const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  const applyRM = () => { App.mot = rm && rm.matches ? 0.35 : 1; App.grain = !(rm && rm.matches); };
  applyRM(); if (rm && rm.addEventListener) rm.addEventListener('change', applyRM);
  buildDev();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
  // let the page paint before the (multi-second on phones) world build
  setTimeout(() => {
    try { Sky.init(); } catch (err) { console.error(err); Sky.ok = false; }
    buildWorld();
    resize();
    renderFrame(0);
    window.OQD.ready = true;
    if (!window.__OQD_TEST) requestAnimationFrame(tick);
  }, 60);
}
window.OQD = {
  renderAt(t) { App.t = t; const e = renderFrame(t); return { hour: e.hour, sunEl: e.sunEl, gl: Sky.ok, dog: App.dog ? { vis: App.dog.vis, X: App.dog.X, Z: App.dog.Z, kind: App.dog.kind } : null, cars: App.vs.map(s => s.v.type + '@' + sx(s.X, s.Z).toFixed(0)) }; },
  App, computeEnv, dogState, vehicleStates, Sky, MOBILE, Snd,
  audioSim() { Snd.start(); for (let t = 0; t < 60; t += 0.05) Snd.update(computeEnv(t), t, true, vehicleStates(t), dogState(t)); return { state: Snd.ctx && Snd.ctx.state, ...Snd.stats }; },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
