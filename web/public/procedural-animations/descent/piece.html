<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DESCENT</title>
<style>
/* Self-hosted in place of Google Fonts; licenses in fonts/. Same families, weights and display. */
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/CormorantGaramond-Latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/CormorantGaramond-Latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:300;font-stretch:100%;font-display:swap;src:url(fonts/IBMPlexSansVar-Roman-Latin1.woff2) format('woff2');unicode-range:U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-stretch:100%;font-display:swap;src:url(fonts/IBMPlexSansVar-Roman-Latin1.woff2) format('woff2');unicode-range:U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02}

<style>
  :root{
    --bg:#000;
    --ink:#e4f1f4;
    --panel:rgba(5,12,20,.86);
    --panel-line:rgba(150,195,210,.2);
    --panel-ink:#c9dfe6;
    --accent:#7fd3e2;
    --k:1;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#000; --ink:#e4f1f4; --panel:rgba(5,12,20,.86); --panel-ink:#c9dfe6; }
  }
  :root[data-theme="dark"]{ --bg:#000; --ink:#e4f1f4; --panel:rgba(5,12,20,.86); --panel-ink:#c9dfe6; }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ height:100%; margin:0; background:var(--bg); overflow:hidden; }
  #frame{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage{ position:relative; overflow:hidden; background:#000; width:100%; aspect-ratio:16/9; max-width:100%; }
  #view{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #type{ position:absolute; inset:0; pointer-events:none; color:var(--ink); }
  #marker{ position:absolute; left:calc(98px*var(--k)); bottom:calc(86px*var(--k)); display:flex; flex-direction:column; align-items:flex-start; gap:max(calc(14px*var(--k)),4px); }
  #depth{
    display:flex; align-items:baseline; gap:max(calc(16px*var(--k)),5px);
    font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-weight:300; font-size:max(calc(27px*var(--k)),11px); letter-spacing:.035em;
    font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;
    opacity:0; text-shadow:0 0 calc(18px*var(--k)) rgba(0,28,48,.4);
  }
  #depth .rule{ width:max(calc(38px*var(--k)),12px); height:1px; background:currentColor; opacity:.5; align-self:center; }
  #depth .unit{ font-size:.6em; letter-spacing:.14em; opacity:.72; }
  #zone{
    margin-left:calc(max(calc(38px*var(--k)),12px) + max(calc(16px*var(--k)),5px));
    font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:400;
    font-size:max(calc(11.5px*var(--k)),7px); letter-spacing:.44em; opacity:0;
    text-shadow:0 0 calc(14px*var(--k)) rgba(0,28,48,.45);
  }
  #title{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-64%);
    text-align:center; font-family:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
    font-weight:300; font-size:max(calc(66px*var(--k)),13px); letter-spacing:.62em; padding-left:.62em;
    opacity:0; white-space:nowrap;
  }
  #title-depth{
    position:absolute; left:0; right:0; top:50%; transform:translateY(calc(44px*var(--k)));
    text-align:center; font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-weight:300; font-size:max(calc(17px*var(--k)),9px); letter-spacing:.32em; padding-left:.32em;
    font-variant-numeric:tabular-nums lining-nums; opacity:0;
  }

  #panel{
    position:absolute; top:12px; right:12px; width:min(300px, calc(100% - 24px));
    background:var(--panel); border:1px solid var(--panel-line); border-radius:8px; padding:12px 14px 10px;
    color:var(--panel-ink); font:12px/1.4 'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:2;
  }
  #panel[hidden]{ display:none; }
  #panel .row{ display:flex; align-items:center; gap:8px; }
  #panel button{
    font:inherit; color:inherit; background:rgba(127,211,226,.08); border:1px solid var(--panel-line);
    border-radius:5px; padding:4px 10px; cursor:pointer;
  }
  #panel button:hover{ background:rgba(127,211,226,.16); }
  #panel :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #p-time{ margin-left:auto; font-variant-numeric:tabular-nums; opacity:.8; }
  #scrub{ width:100%; margin:10px 0 8px; accent-color:var(--accent); }
  #panel .toggles{ display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; }
  #panel label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  #panel input[type=checkbox]{ accent-color:var(--accent); margin:0; }
  #panel .hint{ margin-top:8px; opacity:.55; font-size:11px; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="view" aria-label="DESCENT: an animated descent from the ocean surface to 2,437 metres" role="img"></canvas>
    <div id="type" aria-hidden="true">
      <div id="marker">
        <div id="zone"></div>
        <div id="depth"><span class="rule"></span><span><span id="depth-num">0</span></span><span class="unit">m</span></div>
      </div>
      <div id="title">DESCENT</div>
      <div id="title-depth">2,437 m</div>
    </div>
    <div id="panel" hidden>
      <div class="row">
        <button id="b-play" type="button">Pause</button>
        <button id="b-restart" type="button">Restart</button>
        <span id="p-time">0.00 s</span>
      </div>
      <input id="scrub" type="range" min="0" max="21" step="0.01" value="0" aria-label="Timeline">
      <div class="toggles">
        <label><input type="checkbox" data-k="far" checked> Far layer</label>
        <label><input type="checkbox" data-k="mid" checked> Mid layer</label>
        <label><input type="checkbox" data-k="near" checked> Near layer</label>
        <label><input type="checkbox" data-k="particles" checked> Particles</label>
        <label><input type="checkbox" data-k="animals" checked> Animals</label>
        <label><input type="checkbox" data-k="lighting" checked> Lighting</label>
        <label><input type="checkbox" data-k="type" checked> Typography</label>
        <label><input type="checkbox" data-k="post" checked> Post</label>
      </div>
      <div class="hint">Space: play or pause. R: restart. D: hide this panel.</div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

/* =====================================================================
   Constants and math
   Every frame is a pure function of time t. No state accumulates between
   frames, so scrubbing, pausing and looping cannot desynchronise anything.
   ===================================================================== */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const T = 21;                 // loop length (s)
const F = 1100;               // focal length in logical px (≈52° vertical FOV)
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const MG = 70;                // wrap margin for particle fields

const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const sat = x => x < 0 ? 0 : (x > 1 ? 1 : x);
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, x) => { const u = sat((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const bump = (a, b, c, d, x) => smooth(a, b, x) * (1 - smooth(c, d, x));
const fract = x => x - Math.floor(x);
const mod = (x, m) => { const r = x % m; return r < 0 ? r + m : r; };
const ease = u => { u = sat(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Monotone cubic (Fritsch–Carlson): smooth curves with no overshoot.
function monotone(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = (d[i - 1] * d[i] <= 0) ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + sat(a || 0).toFixed(4) + ')';
const rgb = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const mix3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
function keyColor(table, m) {
  if (m <= table[0][0]) return table[0][1];
  for (let i = 0; i < table.length - 1; i++) {
    const a = table[i], b = table[i + 1];
    if (m <= b[0]) return mix3(a[1], b[1], (m - a[0]) / (b[0] - a[0]));
  }
  return table[table.length - 1][1];
}

/* =====================================================================
   Environment, palette, timeline
   ===================================================================== */
const mqRM = window.matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;
const IS_MOBILE = window.matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;
const Q = IS_MOBILE ? 0.6 : 1;

// Ambient water colour by depth (m). Warm wavelengths drop out first; violet hint in the deep.
const WATER = [
  [-250, [205, 240, 246]], [0, [150, 214, 226]], [12, [92, 184, 206]], [35, [50, 146, 188]],
  [80, [26, 108, 166]], [150, [14, 76, 140]], [240, [9, 52, 108]], [360, [6, 32, 76]],
  [520, [4, 18, 46]], [720, [4, 9, 27]], [950, [5, 5, 18]], [1250, [3, 2, 9]],
  [1700, [1, 1, 4]], [2300, [0, 0, 1]], [4000, [0, 0, 0]]
];
// Colour of downwelling sunlight by depth.
const LIGHT = [[0, [252, 248, 236]], [20, [222, 244, 248]], [60, [165, 224, 250]], [140, [112, 186, 245]], [300, [70, 134, 230]], [600, [48, 92, 200]]];
const TEAL = [96, 238, 206], CYAN = [100, 206, 255], BLUE = [96, 146, 255], VIOLET = [150, 126, 255];

// Displayed depth (m) over time.
const depthAt = monotone([[0, 0], [1.0, 0], [2.0, 5], [3.0, 22], [4.0, 62], [4.6, 120], [5.9, 200], [7.9, 350],
  [10, 520], [12, 705], [13, 1000], [14.3, 1500], [15.5, 2000], [16.6, 2330], [17.5, 2437], [21, 2437]]);
// Visual camera speed (world m/s) — decoupled from displayed metres so parallax reads well.
const camVel = monotone([[0, 0], [0.8, 0], [2.6, 0.55], [5.5, 0.62], [8.4, 0.56], [9.6, 0.40], [11.2, 0.38],
  [12.4, 0.42], [14, 0.30], [15.8, 0.12], [17.3, 0.02], [18.4, 0], [21, 0]]);
const CAM_HZ = 240;
const camTable = (() => {
  const n = Math.ceil(T * CAM_HZ) + 2, tab = new Float64Array(n);
  let acc = 0;
  for (let i = 0; i < n; i++) { tab[i] = acc; const tt = i / CAM_HZ; acc += (camVel(tt) + camVel(tt + 1 / CAM_HZ)) * 0.5 / CAM_HZ; }
  return tab;
})();
function camYAt(t) {
  const f = clamp(t, 0, T) * CAM_HZ, i = Math.min(Math.floor(f), camTable.length - 2);
  return camTable[i] + (camTable[i + 1] - camTable[i]) * (f - i);
}
const pitchAt = t => (12 - 9 * smooth(0.8, 7.0, t)) * DEG;   // looks up at the surface, levels out
const hAt = t => CY + F * Math.tan(pitchAt(t));              // screen y of the camera's own depth
const darkMask = t => 1 - 0.95 * bump(13.1, 13.5, 13.95, 14.45, t);  // the near-total-black moment

// World position that lands on screen (sx, sy) at depth z at time tc (ignores handheld drift).
function placeWorld(sx, sy, z, tc) { return [(sx - CX) * z / F, camYAt(tc) + (sy - hAt(tc)) * z / F]; }

const cam = { t: 0, m: 0, x: 0, y: 0, h: CY, dh: 0, pitch: 0, roll: 0, vel: 0 };
function updateCam(t) {
  const d = RM ? 0 : 1;
  cam.t = t; cam.m = depthAt(t); cam.pitch = pitchAt(t); cam.h = CY + F * Math.tan(cam.pitch);
  cam.dh = (hAt(Math.min(T, t + 0.02)) - hAt(Math.max(0, t - 0.02))) / 0.04;
  cam.vel = camVel(t);
  cam.x = d * (0.05 * Math.sin(0.23 * t + 0.4) + 0.025 * Math.sin(0.61 * t + 2.1));
  cam.y = camYAt(t) + d * 0.012 * Math.sin(0.37 * t + 0.7);
  cam.roll = d * (0.0045 * Math.sin(0.29 * t + 1.0) + 0.002 * Math.sin(0.83 * t + 0.3));
}
const SUN = (() => { const e = 52 * DEG, az = 0.22; return [Math.cos(e) * Math.sin(az), Math.sin(e), Math.cos(e) * Math.cos(az)]; })();
function sunScreen() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const yc = SUN[1] * cp - SUN[2] * sp, zc = SUN[1] * sp + SUN[2] * cp;
  return { x: CX + F * SUN[0] / zc - cam.x * F / 60, y: CY - F * yc / zc };
}

/* =====================================================================
   Canvas setup and sprites
   ===================================================================== */
const stage = document.getElementById('stage');
const frameEl = document.getElementById('frame');
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d', { alpha: false });
let scale = 1, quality = IS_MOBILE ? 0.6 : 1, grainOn = !IS_MOBILE;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// Sprites are kept as small mip chains so a 3 px glow never resamples a 128 px image.
const MIP = [8, 16, 32, 64, 128];
function mips(paint) { return MIP.map(S => { const cv = mk(S, S); paint(cv.getContext('2d'), S); return cv; }); }
const pick = (m, size) => size <= 8 ? m[0] : size <= 16 ? m[1] : size <= 32 ? m[2] : size <= 64 ? m[3] : m[4];
function glowSprite(c) {
  const hotC = [Math.min(255, c[0] + 120), Math.min(255, c[1] + 50), Math.min(255, c[2] + 30)];
  return mips((g, S) => {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    for (let i = 0; i <= 20; i++) {
      const r = i / 20;
      const a = 0.95 * Math.exp(-Math.pow(r / 0.075, 2)) + 0.3 * Math.exp(-Math.pow(r / 0.24, 2)) + 0.07 * Math.exp(-Math.pow(r / 0.55, 2));
      const fade = r > 0.8 ? (1 - r) / 0.2 : 1;
      gr.addColorStop(r, rgba(mix3(c, hotC, Math.exp(-Math.pow(r / 0.06, 2))), Math.min(1, a) * fade));
    }
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
  });
}
// Gaussian-falloff radial gradient helper (avoids banded disc edges in the dark)
function gaussFill(c2, x, y, r, col, a) {
  const g = c2.createRadialGradient(x, y, 0, x, y, r);
  for (let i = 0; i <= 10; i++) { const u = i / 10; g.addColorStop(u, rgba(col, a * Math.exp(-Math.pow(u / 0.5, 2) * 2.2) * (u > 0.9 ? (1 - u) / 0.1 : 1))); }
  c2.fillStyle = g; c2.fillRect(x - r, y - r, 2 * r, 2 * r);
}
const SPR = { teal: glowSprite(TEAL), cyan: glowSprite(CYAN), blue: glowSprite(BLUE), violet: glowSprite(VIOLET) };
// Particle sprite is re-tinted as the light colour changes with depth (quantised to avoid churn).
const dotM = MIP.map(S => mk(S, S));
let dotTint = '', dotFill = 'rgb(255,255,255)';
function tintDot(c) {
  const q = [c[0] & ~3, c[1] & ~3, c[2] & ~3], key = q.join(',');
  if (key === dotTint) return; dotTint = key; dotFill = rgb(q);
  dotM.forEach((cv, i) => {
    const S = MIP[i], g2 = cv.getContext('2d');
    g2.clearRect(0, 0, S, S);
    const g = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, rgba(q, 1)); g.addColorStop(0.35, rgba(q, 0.55)); g.addColorStop(0.7, rgba(q, 0.12)); g.addColorStop(1, rgba(q, 0));
    g2.fillStyle = g; g2.fillRect(0, 0, S, S);
  });
}
function glow(spr, x, y, size, a) {
  if (a <= 0.002 || size <= 0.2) return;
  ctx.globalAlpha = a > 1 ? 1 : a;
  ctx.drawImage(pick(spr, size), x - size / 2, y - size / 2, size, size);
}

// Surface buffer: perspective-mapped underside of the sea surface, rendered per pixel at low resolution.
const SURF = { w: 0, h: 0, cv: null, ctx: null, img: null, x0: -40, y0: -40, ww: W + 80, hh: H + 80 };
function setupSurface() {
  SURF.w = Math.round((IS_MOBILE ? 128 : 184) * Math.max(0.7, quality));
  SURF.h = Math.round(SURF.w * SURF.hh / SURF.ww);
  SURF.cv = mk(SURF.w, SURF.h); SURF.ctx = SURF.cv.getContext('2d');
  SURF.img = SURF.ctx.createImageData(SURF.w, SURF.h);
}
setupSurface();

// Light-shaft buffer: drawn at quarter resolution so shaft edges stay soft.
const RAYB = { w: 480, h: 270 }; RAYB.cv = mk(RAYB.w, RAYB.h); RAYB.ctx = RAYB.cv.getContext('2d');
// Creature silhouette buffer (low-res = soft edges for free).
const CR = { w: 200, h: 113 }; CR.cv = mk(CR.w, CR.h); CR.ctx = CR.cv.getContext('2d');

// Film grain tile.
const grain = (() => {
  const cv = mk(192, 192), g = cv.getContext('2d'), im = g.createImageData(192, 192), r = rng(99);
  for (let i = 0; i < im.data.length; i += 4) { const v = 96 + (r() * 64 | 0); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return cv;
})();
let grainPat = null;

function resize() {
  const fw = frameEl.clientWidth, fh = frameEl.clientHeight;
  let w = fw, h = fw * 9 / 16;
  if (h > fh) { h = fh; w = fh * 16 / 9; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--k', (w / 1920).toFixed(4));
  const dpr = window.devicePixelRatio || 1;
  const bw = Math.max(320, Math.round(Math.min(w * dpr, 1920 * quality)));
  canvas.width = bw; canvas.height = Math.round(bw * 9 / 16);
  scale = bw / W;
  grainPat = ctx.createPattern(grain, 'repeat');
  state.dirty = true;
}

/* =====================================================================
   Seeded populations
   ===================================================================== */
// --- Marine snow

// Tileable-style water caustic (after Dave Hoskins' well-known shader), 3 iterations.
function caustic(x, y, time) {
  const px = x - 250, py = y - 250;
  let ix = px, iy = py, c = 1;
  for (let n = 0; n < 3; n++) {
    const tt = time * (1 - 3.5 / (n + 1));
    const nx = px + Math.cos(tt - ix) + Math.sin(tt + iy);
    const ny = py + Math.sin(tt - iy) + Math.cos(tt + ix);
    ix = nx; iy = ny;
    const a = px * 0.005 / Math.sin(ix + tt), b = py * 0.005 / Math.cos(iy + tt);
    c += 1 / Math.sqrt(a * a + b * b);
  }
  c = 1.17 - Math.pow(c / 3, 1.4);
  return Math.pow(Math.abs(c), 8);
}

function drawSurface(t) {
  const m = cam.m, cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const K = m * 0.85 + 2.6;                    // optical path to the surface along the vertical (m)
  { const y = (CY - SURF.y0) / F, up = y * cp + sp, u = up / Math.sqrt(y * y + 1); if (u <= 0 || Math.exp(-K / u / 26) < 0.004) return; }
  const { w, h, img } = SURF, d = img.data;
  const D = 1.3 + cam.y * 0.5;                 // geometric depth used for ripple perspective
  const time = t * 0.55 + 17.3, drift = t * 0.12;
  const cosC = Math.cos(62 * DEG);             // artistic Snell's-window half-angle
  const fog = keyColor(WATER, m);
  const tirC = [lerp(92, fog[0], 0.5), lerp(176, fog[1], 0.5), lerp(196, fog[2], 0.5)];
  for (let j = 0; j < h; j++) {
    const sy = SURF.y0 + (j + 0.5) * SURF.hh / h;
    const y = (CY - sy) / F, up = y * cp + sp, fw = cp - y * sp;
    let k = j * w * 4;
    if (up <= 0.003) { for (let i = 0; i < w; i++, k += 4) d[k + 3] = 0; continue; }
    const r2 = up * up + fw * fw;
    for (let i = 0; i < w; i++, k += 4) {
      const sx = SURF.x0 + (i + 0.5) * SURF.ww / w;
      const x = (sx - CX) / F, len = Math.sqrt(x * x + r2), u = up / len;
      const opt = K / u, Ta = Math.exp(-opt / 26);
      if (Ta < 0.003) { d[k + 3] = 0; continue; }
      const dist = D / u;
      const lx = x / len * dist + cam.x, lz = fw / len * dist;
      const c = caustic(lx * 2.2, lz * 2.2 + drift, time);
      const contrast = Math.exp(-dist / (D * 7 + 6)), cc = c * contrast;
      const win = smooth(cosC - 0.035, cosC + 0.03, u);
      const rim = Math.exp(-Math.pow((u - cosC) / 0.018, 2));
      const dot = (x * SUN[0] + up * SUN[1] + fw * SUN[2]) / len;
      const sunB = Math.exp((dot - 1) / 0.07), sunS = Math.exp((dot - 1) / 0.006);

  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let j = 1; j < SIPH.n; j++) ctx.lineTo(pts[2 * j], pts[2 * j + 1]);
  ctx.strokeStyle = rgba(TEAL, 0.05 * vis); ctx.lineWidth = 0.8; ctx.stroke();
  const wave = fract(t / 3.4) * 1.6 - 0.3;
  for (let j = 0; j < SIPH.n; j++) {
    const u = j / (SIPH.n - 1);
    const head = j < 6;                                  // swimming bells at the front
    const cl = (j % 5 === 0) ? 1 : (j % 5 === 1 ? 0.55 : 0.18);  // clustered groups along the stem
    const b = (head ? 0.75 : cl) * (0.35 + 0.95 * Math.exp(-((u - wave) * (u - wave)) / 0.005));
    const sz = head ? 4.5 - j * 0.35 : 2.2 + 2.2 * cl;
    glow(SPR.teal, pts[2 * j], pts[2 * j + 1], sz * 7, 0.18 * b * vis);
    glow(head ? SPR.cyan : SPR.teal, pts[2 * j], pts[2 * j + 1], sz * 1.8, 0.75 * b * vis);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawOrganisms(t, zmin, zmax) {
  if (!toggles.animals) return;
  const mask = darkMask(t);
  ctx.globalCompositeOperation = 'lighter';
  for (const o of ORG) {
    if (o.z < zmin || o.z >= zmax || !layerOK(o.z)) continue;
    const on = smooth(o.ton, o.ton + 0.7, t) * (1 - smooth(o.toff, o.toff + 0.9, t));
    if (on <= 0.003) continue;
    const k = F / o.z, dm = RM ? 0.3 : 1;
    const wx = o.wx + dm * o.da * Math.sin(t * o.df + o.pp);
    const wy = o.wy + dm * o.da * 0.7 * Math.cos(t * o.df * 0.8 + o.pp) + o.sink * t;
    const sx = CX + (wx - cam.x) * k, sy = cam.h + (wy - cam.y) * k;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    const pulse = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * o.pf + o.pp), 2.2);
    const b = on * pulse * mask * o.b, sz = o.size * Math.sqrt(6 / o.z);
    glow(o.spr, sx, sy, sz * 10, 0.2 * b);
    glow(o.spr, sx, sy, sz * 2.6, 0.85 * b);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawFlashes(t, zmin, zmax) {
  if (!toggles.animals) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const f of FL) {
    const dt = t - f.t;
    if (dt < 0 || dt > f.d || f.z < zmin || f.z >= zmax || !layerOK(f.z)) continue;
    let env = dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) / f.dec);
    if (f.dbl && dt > f.dbl) env = Math.max(env, 0.7 * Math.exp(-Math.max(0, dt - f.dbl - 0.04) / f.dec) * smooth(f.dbl, f.dbl + 0.04, dt));
    env *= 1 - smooth(f.d - 0.25, f.d, dt);
    const k = F / f.z, sx = CX + (f.wx - cam.x) * k, sy = cam.h + (f.wy - cam.y) * k;
    const sz = f.size * Math.sqrt(6 / f.z);
    glow(f.spr, sx, sy, sz * 14, 0.22 * env);
    glow(f.spr, sx, sy, sz * 3, 0.9 * env);
  }
  for (const b of BIG) {
    const dt = t - b.t;
    if (dt < 0 || dt > 1.6 || !layerOK(b.z)) continue;
    let env = 0;
    for (const pz of b.pulses) { const d = dt - pz; if (d >= 0) env = Math.max(env, (d < 0.06 ? d / 0.06 : Math.exp(-(d - 0.06) / 0.32))); }
    env *= darkMask(t) * (1 - smooth(1.2, 1.6, dt));
    const k = F / b.z, sx = CX + (b.wx - cam.x) * k, sy = cam.h + (b.wy - cam.y) * k;
    glow(b.spr, sx, sy, b.r * 1.7, 0.1 * env);
    glow(b.spr, sx, sy, b.r * 0.45, 0.45 * env);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* --- The large animal -------------------------------------------------- */
function creatureFrame(t) {
  const tt = t - 13.85, sh = -(cam.y - camYAt(15.2)) * F / 42, ox = -cam.x * F / 42;
  return { hx: 2060 - 430 * tt + ox, hy: 410 + 24 * tt + sh, L: 1120, beta: -0.07 };
}
function thick(s) {
  if (s < 0.09) { const u = 1 - s / 0.09; return 0.9 * Math.sqrt(Math.max(0, 1 - u * u)); }
  if (s < 0.3) return lerp(0.9, 1.0, (s - 0.09) / 0.21);
  return 0.1 + 0.9 * 0.5 * (1 + Math.cos(Math.PI * clamp((s - 0.3) / 0.6, 0, 1)));
}
function creaturePoint(cf, s, t, side) {
  const ux = Math.cos(cf.beta), uy = Math.sin(cf.beta), nx = -uy, ny = ux;
  const und = cf.L * 0.02 * s * s * Math.sin(1.5 * t - 5 * s);
  const prof = side < 0 ? 1 + 0.12 * Math.sin(Math.PI * clamp((s - 0.15) / 0.5, 0, 1)) : 1 + 0.2 * Math.exp(-Math.pow((s - 0.2) / 0.12, 2));
  const th = cf.L * 0.07 * thick(Math.min(s, 0.9)) * side * prof;
  return [cf.hx + ux * s * cf.L + nx * (und + th), cf.hy + uy * s * cf.L + ny * (und + th)];
}
function drawCreature(t) {
  if (t < 13.85 || t > 17.0 || !toggles.far) return;
  const hz = bump(13.85, 14.8, 16.2, 17.0, t) * 0.8;
  const sh = -(cam.y - camYAt(15.2)) * F / 42, ox = -cam.x * F / 42;
  // a faint, distant cloud of light: the only thing the shape can be seen against
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.translate(1060 + ox, 470 + sh); ctx.scale(1, 0.5);
  gaussFill(ctx, 0, 0, 980, [17, 25, 54], 0.9 * hz);
  gaussFill(ctx, 320, -60, 620, [14, 20, 46], 0.55 * hz);
  gaussFill(ctx, -380, 90, 560, [16, 16, 44], 0.45 * hz);
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of SPECKS) {
    const a = hz * s.b * (0.55 + 0.45 * Math.sin(t * s.f + s.p)) * 0.5;
    ctx.fillStyle = rgba([80, 112, 165], a);
    ctx.fillRect(s.x + ox - s.s / 2, s.y + sh - s.s / 2, s.s, s.s);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (!toggles.animals) return;
  // silhouette, rendered small and upscaled so it never resolves into detail
  const cf = creatureFrame(t), c = CR.ctx, sc = CR.w / W;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, CR.w, CR.h);
  c.setTransform(sc, 0, 0, sc, 0, 0);
  c.beginPath();
  const N = 30;
  for (let i = 0; i <= N; i++) { const q = creaturePoint(cf, i / N * 0.9, t, -1); if (i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); }
  const ux = Math.cos(cf.beta), uy = Math.sin(cf.beta), nx = -uy, ny = ux;
  // two long trailing lobes, flexing out of phase
  const base = creaturePoint(cf, 0.9, t, 0);
  for (const sgn of [-1, 1]) {
    const ph = 1.4 * t + (sgn > 0 ? 1.3 : 0);
    const len = cf.L * (sgn > 0 ? 0.2 : 0.17);
    const tipX = base[0] + ux * len + nx * sgn * cf.L * (0.035 + 0.02 * Math.sin(ph));
    const tipY = base[1] + uy * len + ny * sgn * cf.L * (0.035 + 0.02 * Math.sin(ph));
    c.quadraticCurveTo(base[0] + ux * len * 0.5 + nx * sgn * cf.L * 0.03, base[1] + uy * len * 0.5 + ny * sgn * cf.L * 0.03, tipX, tipY);
    c.quadraticCurveTo(base[0] + ux * len * 0.45 + nx * sgn * cf.L * 0.008, base[1] + uy * len * 0.45 + ny * sgn * cf.L * 0.008, base[0] + ux * 6, base[1] + uy * 6);
  }
  for (let i = N; i >= 0; i--) { const q = creaturePoint(cf, i / N * 0.9, t, 0.9); c.lineTo(q[0], q[1]); }
  c.closePath();
  const fg = c.createLinearGradient(cf.hx, cf.hy, cf.hx + Math.cos(cf.beta) * cf.L, cf.hy + Math.sin(cf.beta) * cf.L);
  fg.addColorStop(0, 'rgba(0,0,0,0.75)'); fg.addColorStop(0.12, 'rgba(0,0,0,1)'); fg.addColorStop(0.7, 'rgba(0,0,0,0.92)'); fg.addColorStop(1, 'rgba(0,0,0,0.45)');
  c.lineJoin = 'round';
  c.lineWidth = 46; c.strokeStyle = 'rgba(0,0,0,0.14)'; c.stroke();
  c.lineWidth = 22; c.strokeStyle = 'rgba(0,0,0,0.26)'; c.stroke();
  c.fillStyle = fg; c.fill();
  ctx.globalAlpha = 0.94 * smooth(13.85, 14.25, t) * (1 - smooth(16.55, 17.0, t));
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(CR.cv, 0, 0, W, H);
  ctx.globalAlpha = 1;
  // plankton it brushes past briefly light up
  ctx.globalCompositeOperation = 'lighter';
  for (const d of DISTURB) {
    const dt = t - d.t; if (dt < 0 || dt > 0.9) continue;
    const env = (dt < 0.05 ? dt / 0.05 : Math.exp(-(dt - 0.05) / 0.22)) * (1 - smooth(0.7, 0.9, dt));
    const q = creaturePoint(creatureFrame(d.t), d.s, d.t, d.side * 1.0);
    glow(d.spr, q[0] + nx * d.side * d.off, q[1] + ny * d.side * d.off, d.size * 12, 0.18 * env);
    glow(d.spr, q[0] + nx * d.side * d.off, q[1] + ny * d.side * d.off, d.size * 2.6, 0.7 * env);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* --- Final composition ------------------------------------------------ */
function drawRing(t) {
  if (t < 15.9 || !toggles.animals) return;
  ctx.globalCompositeOperation = 'lighter';
  const dm = RM ? 0.3 : 1;
  for (const o of RING) {
    const b = smooth(o.a0, o.a0 + 0.7, t) * (1 - smooth(o.e0, o.e0 + o.ed, t));
    if (b <= 0.002) continue;
    const u = ease((t - o.m0) / o.md);
    const ang = o.th + 0.022 * (t - 16);
    const tx = CX + Math.cos(ang) * o.rad, ty = CY - 14 + Math.sin(ang) * o.rad * 0.95;
    const dx = tx - o.sx, dy = ty - o.sy, L = Math.hypot(dx, dy) + 1e-6;
    const bend = Math.sin(Math.PI * u) * o.bend;
    const wob = dm * (1 - 0.6 * u);
    const x = lerp(o.sx, tx, u) - dy / L * bend + wob * (7 * Math.sin(t * o.f1 + o.p1)) + dm * 3 * Math.sin(t * 0.37 + o.p2);
    const y = lerp(o.sy, ty, u) + dx / L * bend + wob * (6 * Math.cos(t * o.f2 + o.p2)) + dm * 3 * Math.cos(t * 0.29 + o.p1);
    const pulse = 0.72 + 0.28 * Math.sin(t * o.pf + o.pp);
    glow(o.spr, x, y, o.halo, 0.2 * b * pulse);
    glow(o.spr, x, y, o.core * 5, 0.55 * b * pulse);
    glow(o.spr, x, y, o.core * 2.2, 0.95 * b * pulse);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* --- Post ------------------------------------------------------------- */
function drawPost(t) {
  if (toggles.post) {
    const v = ctx.createRadialGradient(CX, CY, 420, CX, CY, 1240);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    // grain only where there is light for it to modulate (overlay on black is a no-op)
    const gA = 0.07 * (1 - smooth(500, 1100, cam.m));
    if (grainOn && grainPat && gA > 0.005) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = gA;
      const o = (Math.floor(t * 24) * 7919) % 192;
      ctx.translate(-o, -((o * 3) % 192));
      ctx.fillStyle = grainPat; ctx.fillRect(o, (o * 3) % 192, canvas.width, canvas.height);
      ctx.restore();
    }
  }
  // loop seam: fade up from a faint glow at the start, return to it at the end
  const fadeIn = smooth(0.05, 1.7, t);
  const glowA = t < 10 ? 0.3 * (1 - smooth(0.0, 1.5, t)) : 0.3 * smooth(20.55, 21.0, t);
  if (fadeIn < 1) { ctx.globalAlpha = 1 - fadeIn; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (glowA > 0.002) {
    const g = ctx.createLinearGradient(0, 0, 0, 560);
    g.addColorStop(0, rgba([70, 150, 188], glowA)); g.addColorStop(0.45, rgba([28, 86, 132], glowA * 0.35)); g.addColorStop(1, rgba([0, 0, 0], 0));
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, 560); ctx.globalCompositeOperation = 'source-over';
  }
}

/* --- Frame -------------------------------------------------------------- */
function renderFrame(t) {
  updateCam(t);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(cam.roll); ctx.translate(-CX, -CY);

  if (toggles.far) drawWater(); else { ctx.fillStyle = rgb(keyColor(WATER, cam.m)); ctx.fillRect(-120, -120, W + 240, H + 240); }
  if (toggles.lighting && toggles.far) drawSurface(t);
  drawCreature(t);
  drawParticles(t, 9, 99);
  drawSiphonophore(t);
  drawOrganisms(t, 8, 99);
  drawFlashes(t, 8, 99);
  drawJellies(t, 8, 99);
  if (toggles.lighting) drawLight(t);
  drawParticles(t, 2.6, 9);
  drawOrganisms(t, 2.5, 8);
  drawFlashes(t, 2.5, 8);
  drawJellies(t, 2.5, 8);
  drawFish(t);
  drawBubbles(t);
  drawParticles(t, 1.5, 2.6);
  drawOrganisms(t, 0, 2.5);
  drawFlashes(t, 0, 2.5);
  drawJellies(t, 0, 2.5);
  drawParticles(t, 0, 1.5);
  drawRing(t);

  ctx.restore();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawPost(t);
}

/* =====================================================================
   Typography (DOM, for real letter-spacing and tabular figures)
   ===================================================================== */
const elDepth = document.getElementById('depth'), elNum = document.getElementById('depth-num');
const elZone = document.getElementById('zone'), elTitle = document.getElementById('title'), elTD = document.getElementById('title-depth');
const ZONES = [['SUNLIGHT ZONE', 1.5, 2.3, 3.5, 4.3], ['TWILIGHT ZONE', 8.2, 9.0, 10.4, 11.2], ['MIDNIGHT ZONE', 13.0, 13.8, 14.9, 15.7]];
let lastNum = '', lastZone = '';
const setOp = (el, v) => { const s = v.toFixed(3); if (el._op !== s) { el.style.opacity = s; el._op = s; } };
function updateType(t) {
  const on = toggles.type ? 1 : 0;
  setOp(elDepth, on * 0.88 * smooth(1.0, 1.9, t) * (1 - smooth(16.6, 17.4, t)));
  const n = Math.round(depthAt(t)).toLocaleString('en-US');
  if (n !== lastNum) { elNum.textContent = n; lastNum = n; }
  let zt = '', zo = 0;
  for (const z of ZONES) { const o = bump(z[1], z[2], z[3], z[4], t); if (o > zo) { zo = o; zt = z[0]; } }
  if (zt && zt !== lastZone) { elZone.textContent = zt; lastZone = zt; }
  setOp(elZone, on * 0.6 * zo);
  const to = bump(18.15, 18.95, 19.3, 19.85, t);
  setOp(elTitle, on * 0.94 * to);
  const ls = (0.74 - 0.12 * smooth(18.15, 19.2, t)).toFixed(3) + 'em';
  if (elTitle._ls !== ls) { elTitle.style.letterSpacing = ls; elTitle.style.paddingLeft = ls; elTitle._ls = ls; }
  setOp(elTD, on * 0.72 * bump(18.45, 19.1, 19.3, 19.8, t));
}

/* =====================================================================
   Playback, controls, adaptive quality
   ===================================================================== */
const state = { t: 0, playing: true, last: 0, dirty: true };
const panel = document.getElementById('panel'), bPlay = document.getElementById('b-play'), bRestart = document.getElementById('b-restart');
const scrub = document.getElementById('scrub'), pTime = document.getElementById('p-time');
let scrubbing = false;
function setPlaying(p) { state.playing = p; bPlay.textContent = p ? 'Pause' : 'Play'; state.last = 0; }
function restart() { state.t = 0; state.dirty = true; setPlaying(true); }
function togglePanel() { panel.hidden = !panel.hidden; }
function updatePanel() {
  if (panel.hidden) return;
  pTime.textContent = state.t.toFixed(2) + ' s';
  if (!scrubbing) scrub.value = state.t.toFixed(2);
}
bPlay.addEventListener('click', () => setPlaying(!state.playing));
bRestart.addEventListener('click', restart);
scrub.addEventListener('input', () => { scrubbing = true; state.t = clamp(parseFloat(scrub.value) || 0, 0, T - 0.001); state.dirty = true; });
scrub.addEventListener('change', () => { scrubbing = false; });
panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => { toggles[cb.dataset.k] = cb.checked; state.dirty = true; }));
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') { e.preventDefault(); setPlaying(!state.playing); }
  else if (k === 'r' || k === 'R') { restart(); }
  else if (k === 'd' || k === 'D') { togglePanel(); state.dirty = true; }
});
// touch devices: double-tap toggles the panel
let lastTap = 0;
stage.addEventListener('touchend', e => { if (e.target.closest('#panel')) return; const n = performance.now(); if (n - lastTap < 320) togglePanel(); lastTap = n; }, { passive: true });
mqRM.addEventListener && mqRM.addEventListener('change', () => { RM = mqRM.matches; state.dirty = true; });
window.addEventListener('resize', resize);

// Adaptive quality: watch real frame intervals while playing; if the average stays slow,
// drop grain, then render resolution, one step at a time with a settling period between steps.
let perfAcc = 0, perfN = 0, perfHold = 0;
function adapt(rawDt) {
  if (!state.playing || document.hidden || rawDt <= 0 || rawDt > 0.25) return;
  if (perfHold > 0) { perfHold--; return; }
  perfAcc += rawDt; perfN++;
  if (perfN < 75) return;
  const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
  if (avg < 0.026) return;
  if (grainOn) grainOn = false;
  else if (quality > 0.55) { quality = Math.max(0.55, quality * 0.82); resize(); setupSurface(); }
  else return;
  perfHold = 45;
}
function tick(now) {
  const raw = state.last ? (now - state.last) / 1000 : 0;
  const dt = Math.min(0.1, raw);
  state.last = now;
  adapt(raw);
  if (state.playing && !scrubbing) { state.t += dt; if (state.t >= T) state.t -= T; state.dirty = true; }
  if (state.dirty) {
    renderFrame(state.t); updateType(state.t); updatePanel();
    state.dirty = false;
  }
  requestAnimationFrame(tick);
}

// Small scripting surface (used for review; harmless in normal viewing).
window.DESCENT = {
  seek(t) { state.t = mod(t, T); renderFrame(state.t); updateType(state.t); updatePanel(); },
  play() { setPlaying(true); }, pause() { setPlaying(false); },
  get time() { return state.t; },
  get quality() { return { scale: quality, grain: grainOn, canvas: [canvas.width, canvas.height] }; },
  probe(t) {
    updateCam(t); computeFish(t);
    const out = [];
    for (let i = 0; i < NF; i++) out.push(FO.on[i] ? [FO.sx[i], FO.sy[i], FO.L[i]] : null);
    return out;
  },
  setReducedMotion(v) { RM = !!v; state.dirty = true; }
};

resize();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
