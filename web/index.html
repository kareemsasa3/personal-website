    <script>
      (function () {
        var STORAGE_KEY = "theme";
        var NAV_MODE_STORAGE_KEY = "web-nav-mode";
        var root = document.documentElement;

        function resolveNavMode() {
          try {
            var saved = localStorage.getItem(NAV_MODE_STORAGE_KEY);
            if (saved === "dock" && !window.matchMedia("(min-width: 430px)").matches) {
              return "header";
            }
            if (saved === "dock" || saved === "header") {
              return saved;
            }
          } catch (_) {}

          return "header";
        }

        var THEMES = ["dark", "light", "mono"];

        function resolveTheme() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (THEMES.indexOf(saved) !== -1) {
              return saved;
            }
          } catch (_) {}

          return "dark";
        }

        // Theme values live in the built CSS (Darkfield tokens.css); this only selects one.
        function applyTheme(theme) {
          root.dataset.theme = theme;
          root.style.colorScheme = theme === "light" ? "light" : "dark";
        }

        applyTheme(resolveTheme());
        root.dataset.navMode = resolveNavMode();
      })();
    </script>
    <style>
      /*
        Static route-shell presentation. Every prerendered route (and the
        homepage) renders inside .route-fallback before React mounts, and it
        is the entire page for consumers without JavaScript. It flows as a
        normal, scrollable document; .app-ready hides it once the first route
        has rendered (or an error boundary has caught a failure), so it stays
        visible while a lazy route chunk is still loading.
      */
      .route-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 2.5rem 1rem 4rem;
        color: var(--fg, #d0ddd4);
        background: var(--field, #070b08);
        font-family: var(--font-sans, "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      /* Center every top-level block; later rules only set block margins. */
      .route-fallback > * {
        max-width: 48rem;
        margin-inline: auto;
      }

      .route-fallback h1,
      .route-fallback h2,
      .route-fallback h3 {
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .route-fallback h2 {
        margin-block: 0 0.75rem;
        font-size: 1.35rem;
      }

      .route-fallback h3 {
        margin-block: 0 0.5rem;
        font-size: 1.1rem;
      }

      .route-fallback p,
      .route-fallback ul,
      .route-fallback ol {
        margin-block: 0 0.75rem;
      }

      .route-fallback ul,
      .route-fallback ol {
        padding-left: 1.25rem;
      }

      .route-fallback li {
        margin-bottom: 0.35rem;
      }

      .route-fallback a {
        color: var(--signal-dim, #59b26f);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .route-fallback__eyebrow,
      .route-fallback__breadcrumbs,
      .route-fallback__meta {
        margin-block: 0 0.5rem;
        font-size: 0.8rem;
        color: var(--fg-muted, #a6b6aa);
      }

      .route-fallback__eyebrow {
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--signal-dim, #59b26f);
      }

      .route-fallback__title {
        margin-block: 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 700;
      }

      .route-fallback__summary {
        font-size: 1.1rem;
      }

      .route-fallback__section {
        margin-top: 2.25rem;
      }

      .route-fallback__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
        gap: 1rem;
      }

      .route-fallback__card {
        padding: 1rem 1.1rem;
        border: 1px solid var(--rule, #27312a);
        border-radius: 12px;
        background: var(--surface-1, #0d130f);
      }

      .route-fallback__card > :last-child {
        margin-bottom: 0;
      }

      .route-fallback__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .route-fallback__pill {
        display: inline-block;
        padding: 0.1rem 0.55rem;
        border: 1px solid var(--rule, #27312a);
        border-radius: 999px;
        font-size: 0.75rem;
      }

      .route-fallback__card-link {
        display: inline-block;
        margin-top: 0.5rem;
        margin-right: 0.75rem;
        font-weight: 600;
      }

      .route-fallback__label {
        font-weight: 600;
      }

      .route-fallback__toc,
      .route-fallback__series-nav {
        margin-top: 1.5rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--rule, #27312a);
        border-radius: 12px;
      }

      .route-fallback__toc-list--pre-numbered {
        padding-left: 0;
        list-style: none;
      }

      /* Long-form article bodies: keep media and code inside the column. */
      .route-fallback img,
      .route-fallback video {
        max-width: 100%;
        height: auto;
      }

      .route-fallback pre {
        overflow-x: auto;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: var(--surface-1, #0d130f);
      }

      .route-fallback table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      .route-fallback th,
      .route-fallback td {
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--rule, #27312a);
        text-align: left;
        vertical-align: top;
      }

      .app-ready .route-fallback {
        display: none;
      }
    </style>
