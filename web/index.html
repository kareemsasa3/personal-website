    <script>
      (function () {
        var STORAGE_KEY = "theme";
        var NAV_MODE_STORAGE_KEY = "web-nav-mode";
        var root = document.documentElement;

        function resolveNavMode() {
          try {
            var saved = localStorage.getItem(NAV_MODE_STORAGE_KEY);
            if (saved === "dock" || saved === "header") {
              return saved;
            }
          } catch (_) {}

          return "header";
        }

        function resolveTheme() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved === "light" || saved === "dark") {
              return saved;
            }
          } catch (_) {}

          return "dark";
        }

        function applyTheme(theme) {
          var isLight = theme === "light";

          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.setProperty("--app-bg", isLight ? "#f5f5f5" : "#1a1a1a");
          root.style.setProperty(
            "--app-bg-secondary",
            isLight ? "#fafafa" : "#2d2d2d"
          );
          root.style.setProperty(
            "--app-surface",
            isLight ? "#ffffff" : "#2d2d2d"
          );
          root.style.setProperty(
            "--app-overlay",
            isLight ? "rgba(245, 245, 245, 0.88)" : "rgba(26, 26, 26, 0.88)"
          );
          root.style.setProperty("--app-text", isLight ? "#2c2c2c" : "#f8f9fa");
          root.style.setProperty(
            "--app-text-muted",
            isLight ? "#6a6a6a" : "#6c757d"
          );
          root.style.setProperty(
            "--app-border",
            isLight ? "#d0d0d0" : "#495057"
          );
          root.style.setProperty(
            "--brand-primary",
            isLight ? "#007a00" : "#4CAF50"
          );
          root.style.setProperty(
            "--brand-primary-soft",
            isLight ? "#e6f3e6" : "#81C784"
          );
          root.style.setProperty(
            "--bg-canvas-fill",
            isLight ? "#f5f5f5" : "#0f0f0f"
          );
          root.style.setProperty(
            "--bg-canvas-glyph",
            isLight ? "44, 44, 44" : "0, 255, 0"
          );
          root.style.setProperty(
            "--bg-glow-color",
            isLight ? "rgba(106, 106, 106, 0.10)" : "rgba(108, 117, 125, 0.10)"
          );

          root.style.setProperty("--background-color", "var(--app-bg)");
          root.style.setProperty(
            "--background-color-secondary",
            "var(--app-bg-secondary)"
          );
          root.style.setProperty("--card-background", "var(--app-surface)");
          root.style.setProperty("--panel-bg-color", "var(--app-surface)");
          root.style.setProperty("--text-color", "var(--app-text)");
          root.style.setProperty("--text-color-muted", "var(--app-text-muted)");
          root.style.setProperty("--text-muted-color", "var(--app-text-muted)");
          root.style.setProperty("--border-color", "var(--app-border)");
          root.style.setProperty("--primary-color", "var(--brand-primary)");
          root.style.setProperty(
            "--primary-color-light",
            "var(--brand-primary-soft)"
          );
        }

        applyTheme(resolveTheme());
        root.dataset.navMode = resolveNavMode();
      })();
    </script>
    <style>
      /*
        Static route-shell presentation. Every prerendered route (and the
        homepage) renders inside .route-fallback before React mounts, and it
        is the entire page for consumers without JavaScript. It flows as a
        normal, scrollable document; .app-ready hides it once the app mounts.
      */
      .route-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 2.5rem 1rem 4rem;
        color: var(--app-text, #f8f9fa);
        background: var(--app-bg, #1a1a1a);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      /* Center every top-level block; later rules only set block margins. */
      .route-fallback > * {
        max-width: 48rem;
        margin-inline: auto;
      }

      .route-fallback h1,
      .route-fallback h2,
      .route-fallback h3 {
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .route-fallback h2 {
        margin-block: 0 0.75rem;
        font-size: 1.35rem;
      }

      .route-fallback h3 {
        margin-block: 0 0.5rem;
        font-size: 1.1rem;
      }

      .route-fallback p,
      .route-fallback ul,
      .route-fallback ol {
        margin-block: 0 0.75rem;
      }

      .route-fallback ul,
      .route-fallback ol {
        padding-left: 1.25rem;
      }

      .route-fallback li {
        margin-bottom: 0.35rem;
      }

      .route-fallback a {
        color: var(--brand-primary, #4caf50);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .route-fallback__eyebrow,
      .route-fallback__breadcrumbs,
      .route-fallback__meta {
        margin-block: 0 0.5rem;
        font-size: 0.8rem;
        color: var(--app-text-muted, #adb5bd);
      }

      .route-fallback__eyebrow {
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--brand-primary, #4caf50);
      }

      .route-fallback__title {
        margin-block: 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 700;
      }

      .route-fallback__summary {
        font-size: 1.1rem;
      }

      .route-fallback__section {
        margin-top: 2.25rem;
      }

      .route-fallback__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
        gap: 1rem;
      }

      .route-fallback__card {
        padding: 1rem 1.1rem;
        border: 1px solid var(--app-border, #495057);
        border-radius: 12px;
        background: var(--app-surface, #2d2d2d);
      }

      .route-fallback__card > :last-child {
        margin-bottom: 0;
      }

      .route-fallback__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .route-fallback__pill {
        display: inline-block;
        padding: 0.1rem 0.55rem;
        border: 1px solid var(--app-border, #495057);
        border-radius: 999px;
        font-size: 0.75rem;
      }

      .route-fallback__card-link {
        display: inline-block;
        margin-top: 0.5rem;
        margin-right: 0.75rem;
        font-weight: 600;
      }

      .route-fallback__label {
        font-weight: 600;
      }

      .route-fallback__toc,
      .route-fallback__series-nav {
        margin-top: 1.5rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--app-border, #495057);
        border-radius: 12px;
      }

      .route-fallback__toc-list--pre-numbered {
        padding-left: 0;
        list-style: none;
      }

      /* Long-form article bodies: keep media and code inside the column. */
      .route-fallback img,
      .route-fallback video {
        max-width: 100%;
        height: auto;
      }

      .route-fallback pre {
        overflow-x: auto;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: var(--app-surface, #2d2d2d);
      }

      .route-fallback table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      .route-fallback th,
      .route-fallback td {
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--app-border, #495057);
        text-align: left;
        vertical-align: top;
      }

      .app-ready .route-fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="route-fallback homepage-fallback" aria-label="Site overview">
      <p class="route-fallback__eyebrow">Systems Engineer</p>
      <h1 class="route-fallback__title">Kareem Sasa</h1>
    </main>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
