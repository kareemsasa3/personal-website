server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    # Error pages and the Server header say "nginx" without the version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.map$ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /og-image.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
