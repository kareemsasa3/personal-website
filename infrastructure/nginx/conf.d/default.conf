# HTTP server for ACME challenges and redirects
server {
    listen 80;
    server_name kareemsasa.dev;
    resolver 127.0.0.11 ipv6=off valid=30s;
    
    # ACME Challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # Allow stub_status access without redirect
    location /stub_status {
        access_log off;
        stub_status on;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main portfolio application with HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name kareemsasa.dev;

    # SSL Configuration
    ssl_certificate     /etc/nginx/ssl/live/kareemsasa.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/kareemsasa.dev/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Features the site never uses. Fullscreen (animation pieces) and clipboard
    # writes (Annals) are used and are left at their defaults.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Enforced. It ran report-only first (#37, #38) until a full production
    # crawl reported no violations. Inline scripts are allowed by hash: the
    # theme bootstrap in web/index.html (sha256-aMpez...) and the four
    # procedural animation pieces under
    # web/public/procedural-animations/. web/scripts/smoke-test.mjs fails when a
    # built inline script is missing from script-src or a listed hash is stale.
    # connect-src allows https: for the terminal's curl command.
    # Cloudflare injects scripts at the edge. Web Analytics loads from
    # static.cloudflareinsights.com. JavaScript Detections injects an inline
    # script that changes per request: Cloudflare reads the nonce from this
    # header and adds it to that script. $request_id is a fresh 128-bit value
    # per request, and Cloudflare does not cache the HTML (DYNAMIC).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com 'sha256-aMpezDhk5aux3l6CGyEjYMF1OUDbusvazQp7FcU79NI=' 'sha256-cMS9poMxPR0kYhyVVk5SNPSYIC//I7Whjp6GnrpH9Rg=' 'sha256-A972YuF8cXKHqdnHbrCkraky4rqAb4+SGEC4PHNh+0A=' 'sha256-JhEdI78Tf+Z4IEgCf3J97N2HAyUnEkDrg2AT1ibWC8g=' 'sha256-xRFpSCU2DLlTIVvGfXtey0ahOtL/brnaf8E7k9u4XAM='; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com https://plus.unsplash.com; font-src 'self'; connect-src 'self' https:; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Main portfolio application
    location / {
        set $upstream_web http://web:80;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }    

    # Monitoring UIs must not be publicly exposed from the portfolio origin.
    # Use VPN, SSH tunnel, or an authenticated edge policy for Grafana access.
    location /monitoring/grafana/ {
        return 404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
} 
