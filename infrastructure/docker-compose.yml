name: personal-website
services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - portfolio-network

  # Web - Main portfolio application
  web:
    # Permit nginx's non-root user to bind the established internal port 80.
    # This setting is confined to the container network namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    image: ${WEB_IMAGE:-web:local}
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${WEB_NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
